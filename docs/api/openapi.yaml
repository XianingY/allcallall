openapi: 3.1.0
info:
  title: AllCallAll API
  version: 1.0.0
  description: Authoritative contract consumed by the primary Web client.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /auth/login:
    post:
      security: []
      operationId: login
      requestBody: { $ref: '#/components/requestBodies/Login' }
      responses:
        '200': { $ref: '#/components/responses/Auth' }
        '401': { $ref: '#/components/responses/Error' }
  /auth/register:
    post:
      security: []
      operationId: register
      requestBody: { $ref: '#/components/requestBodies/Register' }
      responses:
        '201': { $ref: '#/components/responses/Auth' }
        '400': { $ref: '#/components/responses/Error' }
  /auth/refresh:
    post:
      security: []
      operationId: refreshSession
      responses:
        '200': { $ref: '#/components/responses/Auth' }
        '401': { $ref: '#/components/responses/Error' }
  /auth/logout:
    post:
      security: []
      operationId: logout
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /auth/logout-all:
    post:
      operationId: logoutAll
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /auth/sessions:
    get:
      operationId: listRefreshSessions
      responses:
        '200':
          description: Active and historical browser sessions.
          content:
            application/json:
              schema:
                type: object
                required: [sessions]
                properties:
                  sessions: { type: array, items: { $ref: '#/components/schemas/RefreshSession' } }
  /auth/sessions/{sessionId}:
    delete:
      operationId: revokeRefreshSession
      parameters:
        - { name: sessionId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /auth/password-reset/send:
    post:
      security: []
      operationId: sendPasswordReset
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [email], properties: { email: { type: string, format: email } } } } }
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /auth/password-reset/confirm:
    post:
      security: []
      operationId: confirmPasswordReset
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PasswordResetRequest' } } }
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /email/send-verification-code:
    post:
      security: []
      operationId: sendVerificationCode
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/VerificationCodeRequest' } } }
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /email/verify-code:
    post:
      security: []
      operationId: verifyEmailCode
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/VerifyCodeRequest' } } }
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /users/me:
    get:
      operationId: getCurrentUser
      responses:
        '200':
          description: Current user.
          content: { application/json: { schema: { type: object, required: [user], properties: { user: { $ref: '#/components/schemas/User' } } } } }
  /users/change-password:
    post:
      operationId: changePassword
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /users/blocks:
    get:
      operationId: listBlocks
      responses:
        '200':
          description: Blocked users.
          content: { application/json: { schema: { type: object, required: [blocks], properties: { blocks: { type: array, items: { $ref: '#/components/schemas/UserBlock' } } } } } }
    post:
      operationId: blockUser
      responses: { '201': { $ref: '#/components/responses/Success' } }
  /users/blocks/{blockedUserId}:
    delete:
      operationId: unblockUser
      parameters:
        - { name: blockedUserId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /users/reports:
    post:
      operationId: reportUser
      responses: { '201': { $ref: '#/components/responses/Success' } }
  /users/me/deletion:
    post:
      operationId: deleteAccount
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /push/devices:
    get:
      operationId: listPushDevices
      responses:
        '200':
          description: Registered push devices for the current user.
          content:
            application/json:
              schema:
                type: object
                required: [devices]
                properties:
                  devices: { type: array, items: { $ref: '#/components/schemas/PushDevice' } }
    post:
      operationId: registerPushDevice
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterPushDeviceRequest' }
      responses:
        '201':
          description: Push device registered.
          content:
            application/json:
              schema:
                type: object
                required: [device]
                properties:
                  message: { type: string }
                  device: { $ref: '#/components/schemas/PushDevice' }
  /push/devices/{deviceId}:
    delete:
      operationId: deletePushDevice
      parameters:
        - { name: deviceId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /entitlements/me:
    get:
      operationId: getMyEntitlements
      responses:
        '200':
          description: Backend-authoritative subscription entitlements.
          content:
            application/json:
              schema:
                type: object
                required: [tier, entitlements]
                properties:
                  tier: { type: string, enum: [free, premium] }
                  entitlements: { type: array, items: { $ref: '#/components/schemas/UserEntitlement' } }
  /usage/me:
    get:
      operationId: getMyUsage
      responses:
        '200':
          description: Current feature usage ledgers.
          content:
            application/json:
              schema:
                type: object
                required: [usage]
                properties:
                  usage: { type: array, items: { $ref: '#/components/schemas/UsageSnapshot' } }
  /legal/current:
    get:
      security: []
      operationId: getCurrentLegal
      responses:
        '200':
          description: Current legal document versions and links.
          content: { application/json: { schema: { type: object, required: [legal], properties: { legal: { $ref: '#/components/schemas/LegalInfo' } } } } }
  /legal/accept:
    post:
      operationId: acceptCurrentLegal
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /organizations:
    get:
      operationId: listOrganizations
      responses:
        '200':
          description: Organizations.
          content: { application/json: { schema: { type: object, required: [organizations], properties: { organizations: { type: array, items: { $ref: '#/components/schemas/Organization' } } } } } }
    post:
      operationId: createOrganization
      responses:
        '201':
          description: Created organization.
          content: { application/json: { schema: { type: object, required: [organization], properties: { organization: { $ref: '#/components/schemas/Organization' } } } } }
  /organizations/{organizationId}/switch:
    post:
      operationId: switchOrganization
      parameters:
        - { name: organizationId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: Selected organization.
          content: { application/json: { schema: { type: object, required: [organization], properties: { organization: { $ref: '#/components/schemas/Organization' } } } } }
  /organizations/{organizationId}/admin/summary:
    get:
      operationId: getOrganizationAdminSummary
      summary: Return enterprise admin dashboard metrics for an organization.
      parameters:
        - { name: organizationId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: Organization admin dashboard summary.
          content:
            application/json:
              schema:
                type: object
                required: [summary]
                properties:
                  summary: { $ref: '#/components/schemas/OrganizationAdminSummary' }
        '403':
          $ref: '#/components/responses/Error'
  /organizations/invites/{code}/accept:
    post:
      operationId: acceptOrganizationInvite
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /realtime/tickets:
    post:
      operationId: issueRealtimeTicket
      summary: Issue a 60-second, channel-bound, single-use WebSocket ticket.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channel]
              properties: { channel: { type: string, enum: [chat, signaling] } }
      responses:
        '201':
          description: Realtime ticket issued.
          content: { application/json: { schema: { $ref: '#/components/schemas/RealtimeTicket' } } }
  /webrtc/config:
    get:
      operationId: getWebRTCConfig
      responses:
        '200':
          description: ICE/TURN configuration.
          content:
            application/json:
              schema:
                type: object
                required: [ice_servers]
                properties:
                  ice_servers:
                    type: array
                    items:
                      type: object
                      required: [urls]
                      properties:
                        urls: { type: array, items: { type: string } }
                        username: { type: string }
                        credential: { type: string }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  requestBodies:
    Login:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/LoginRequest' } } }
    Register:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/RegisterRequest' } } }
  responses:
    Auth:
      description: Authenticated.
      content: { application/json: { schema: { $ref: '#/components/schemas/AuthResponse' } } }
    Error:
      description: Error.
      content: { application/json: { schema: { $ref: '#/components/schemas/APIError' } } }
    Success:
      description: Success.
      content: { application/json: { schema: { type: object, properties: { success: { type: boolean }, message: { type: string } } } } }
  schemas:
    APIError:
      type: object
      required: [success, error]
      properties:
        success: { type: boolean, const: false }
        code: { type: string }
        error: { type: string }
        request_id: { type: string }
    User:
      type: object
      required: [id, email, display_name]
      properties:
        id: { type: integer, format: int64 }
        email: { type: string, format: email }
        display_name: { type: string }
    Organization:
      type: object
      required: [id, name, role]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        slug: { type: string }
        description: { type: string }
        role: { type: string, enum: [owner, admin, member] }
    OrganizationMember:
      type: object
      required: [id, organization_id, user_id, email, display_name, status, role, joined_at, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        organization_id: { type: integer, format: int64 }
        user_id: { type: integer, format: int64 }
        email: { type: string, format: email }
        display_name: { type: string }
        status: { type: string }
        role: { type: string, enum: [owner, admin, member] }
        joined_at: { type: string, format: date-time }
        last_active_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    OrganizationInvite:
      type: object
      required: [id, organization_id, code, target_email, role, status, expires_at]
      properties:
        id: { type: integer, format: int64 }
        organization_id: { type: integer, format: int64 }
        team_id: { type: [integer, 'null'], format: int64 }
        code: { type: string }
        target_email: { type: string, format: email }
        role: { type: string, enum: [owner, admin, member] }
        status: { type: string, enum: [pending, accepted, expired, revoked] }
        accepted_user_id: { type: [integer, 'null'], format: int64 }
        accepted_at: { type: [string, 'null'], format: date-time }
        expires_at: { type: string, format: date-time }
    OrganizationTeamMember:
      type: object
      required: [id, team_id, user_id, email, display_name, role, joined_at, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        team_id: { type: integer, format: int64 }
        user_id: { type: integer, format: int64 }
        email: { type: string, format: email }
        display_name: { type: string }
        role: { type: string }
        joined_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    OrganizationTeam:
      type: object
      required: [id, organization_id, name, slug, created_by, member_count, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        organization_id: { type: integer, format: int64 }
        name: { type: string }
        slug: { type: string }
        description: { type: string }
        created_by: { type: integer, format: int64 }
        member_count: { type: integer, format: int64 }
        members: { type: array, items: { $ref: '#/components/schemas/OrganizationTeamMember' } }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    OrganizationPolicy:
      type: object
      required: [id, organization_id, recording_mode, recording_storage_days, recording_export_allowed]
      properties:
        id: { type: integer, format: int64 }
        organization_id: { type: integer, format: int64 }
        recording_mode: { type: string, enum: [off, admin_opt_in, forced_for_team_meetings] }
        recording_storage_days: { type: integer }
        recording_export_allowed: { type: boolean }
    OrganizationAdminSummary:
      type: object
      required: [counts, recent_meetings, recent_recordings, recent_audit_events]
      properties:
        counts: { $ref: '#/components/schemas/OrganizationAdminSummaryCounts' }
        recent_meetings:
          type: array
          items: { $ref: '#/components/schemas/OrganizationRecentMeeting' }
        recent_recordings:
          type: array
          items: { $ref: '#/components/schemas/OrganizationRecentRecording' }
        recent_audit_events:
          type: array
          items: { $ref: '#/components/schemas/OrganizationAuditEvent' }
    OrganizationAdminSummaryCounts:
      type: object
      required: [member_count, team_count, pending_invite_count, open_conversation_count, pending_approval_count]
      properties:
        member_count: { type: integer, format: int64 }
        team_count: { type: integer, format: int64 }
        pending_invite_count: { type: integer, format: int64 }
        open_conversation_count: { type: integer, format: int64 }
        pending_approval_count: { type: integer, format: int64 }
    OrganizationRecentMeeting:
      type: object
      required: [room_id, title, status, updated_at]
      properties:
        room_id: { type: integer, format: int64 }
        conversation_id: { type: [integer, 'null'], format: int64 }
        title: { type: string }
        status: { type: string }
        started_at: { type: [string, 'null'], format: date-time }
        ended_at: { type: [string, 'null'], format: date-time }
        updated_at: { type: string, format: date-time }
    OrganizationRecentRecording:
      type: object
      required: [recording_session_id, room_id, room_title, recording_status, transcription_status, transcription_segment_count, updated_at]
      properties:
        recording_session_id: { type: integer, format: int64 }
        room_id: { type: integer, format: int64 }
        conversation_id: { type: [integer, 'null'], format: int64 }
        room_title: { type: string }
        recording_status: { type: string }
        transcription_status: { type: string }
        transcription_provider: { type: string }
        transcription_segment_count: { type: integer }
        transcription_error: { type: string }
        started_at: { type: [string, 'null'], format: date-time }
        stopped_at: { type: [string, 'null'], format: date-time }
        updated_at: { type: string, format: date-time }
    OrganizationAuditEvent:
      type: object
      required: [id, organization_id, actor_user_id, actor_email, actor_display_name, action, target_type, target_id, created_at]
      properties:
        id: { type: integer, format: int64 }
        organization_id: { type: integer, format: int64 }
        actor_user_id: { type: integer, format: int64 }
        actor_email: { type: string }
        actor_display_name: { type: string }
        action: { type: string }
        target_type: { type: string }
        target_id: { type: string }
        metadata: { type: object, additionalProperties: true }
        created_at: { type: string, format: date-time }
    AuthResponse:
      type: object
      required: [user, access_token]
      properties:
        user: { $ref: '#/components/schemas/User' }
        access_token: { type: string }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    RegisterRequest:
      type: object
      required: [email, password, display_name, accept_current_legal]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
        display_name: { type: string }
        accept_current_legal: { type: boolean }
    VerificationCodeRequest:
      type: object
      required: [email, purpose]
      properties:
        email: { type: string, format: email }
        purpose: { type: string, enum: [register, password_reset, account_deletion] }
    VerifyCodeRequest:
      allOf:
        - { $ref: '#/components/schemas/VerificationCodeRequest' }
        - type: object
          required: [code]
          properties: { code: { type: string, pattern: '^[0-9]{6}$' } }
    PasswordResetRequest:
      type: object
      required: [email, code, new_password, confirm_password]
      properties:
        email: { type: string, format: email }
        code: { type: string }
        new_password: { type: string, minLength: 8 }
        confirm_password: { type: string, minLength: 8 }
    LegalInfo:
      type: object
      required: [terms_version, privacy_version, terms_url, privacy_policy_url, support_email, account_deletion_url]
      properties:
        terms_version: { type: string }
        privacy_version: { type: string }
        terms_url: { type: string }
        privacy_policy_url: { type: string }
        support_email: { type: string, format: email }
        account_deletion_url: { type: string }
    RefreshSession:
      type: object
      required: [id, status, current, user_agent, ip_address, expires_at, invalid_use_count, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        status: { type: string }
        current: { type: boolean }
        user_agent: { type: string }
        ip_address: { type: string }
        expires_at: { type: string, format: date-time }
        last_used_at: { type: [string, 'null'], format: date-time }
        revoked_at: { type: [string, 'null'], format: date-time }
        invalid_use_count: { type: integer }
        last_invalid_use_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    UserBlock:
      type: object
      required: [id, blocked_user_id, created_at]
      properties:
        id: { type: integer, format: int64 }
        blocked_user_id: { type: integer, format: int64 }
        blocked_user_email: { type: string }
        blocked_user_display_name: { type: string }
        blocked_user_status: { type: string }
        blocked_user_deleted_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
    RegisterPushDeviceRequest:
      type: object
      required: [token]
      properties:
        token: { type: string }
        provider: { type: string, default: fcm }
        platform: { type: string, enum: [web, android, ios] }
        device_name: { type: string }
        app_version: { type: string }
    PushDevice:
      type: object
      required: [id, provider, platform, device_name, app_version, last_registered, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        provider: { type: string }
        platform: { type: string }
        device_name: { type: string }
        app_version: { type: string }
        last_registered: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    UserEntitlement:
      type: object
      required: [id, entitlement, tier, status, source]
      properties:
        id: { type: integer, format: int64 }
        entitlement: { type: string }
        tier: { type: string }
        product_id: { type: string }
        status: { type: string }
        expires_at: { type: [string, 'null'], format: date-time }
        source: { type: string }
    UsageSnapshot:
      type: object
      required: [feature, period_key, unit, used_units, limit_units, unlimited, remaining_units]
      properties:
        feature: { type: string }
        period_key: { type: string }
        unit: { type: string }
        used_units: { type: integer, format: int64 }
        limit_units: { type: integer, format: int64 }
        unlimited: { type: boolean }
        remaining_units: { type: integer, format: int64 }
    Conversation:
      type: object
      required: [id, organization_id, type, title, status, priority, unread_count]
      properties:
        id: { type: integer, format: int64 }
        organization_id: { type: integer, format: int64 }
        team_id: { type: [integer, 'null'], format: int64 }
        room_id: { type: [integer, 'null'], format: int64 }
        type: { type: string }
        title: { type: string }
        topic: { type: string }
        status: { type: string }
        assignee_user_id: { type: [integer, 'null'], format: int64 }
        assignee_email: { type: string }
        assignee_display_name: { type: string }
        priority: { type: string }
        contact_id: { type: [integer, 'null'], format: int64 }
        last_internal_note_at: { type: [string, 'null'], format: date-time }
        last_message_at: { type: [string, 'null'], format: date-time }
        last_message_preview: { type: string }
        last_message_type: { type: string }
        unread_count: { type: integer }
        active_room_id: { type: [integer, 'null'], format: int64 }
        active_room_title: { type: string }
        latest_room_id: { type: [integer, 'null'], format: int64 }
        latest_room_title: { type: string }
        latest_recording_id: { type: [integer, 'null'], format: int64 }
    Message:
      type: object
      required: [id, organization_id, conversation_id, sender_id, sender_email, sender_display_name, type, body, pinned, created_at]
      properties:
        id: { type: integer, format: int64 }
        organization_id: { type: integer, format: int64 }
        conversation_id: { type: integer, format: int64 }
        sender_id: { type: integer, format: int64 }
        sender_email: { type: string }
        sender_display_name: { type: string }
        reply_to_message_id: { type: [integer, 'null'], format: int64 }
        reply_to: { oneOf: [{ $ref: '#/components/schemas/MessageReply' }, { type: 'null' }] }
        type: { type: string }
        body: { type: string }
        metadata: { type: object, additionalProperties: true }
        attachments: { type: array, items: { $ref: '#/components/schemas/Attachment' } }
        reactions: { type: array, items: { $ref: '#/components/schemas/MessageReaction' } }
        pinned: { type: boolean }
        edited_at: { type: [string, 'null'], format: date-time }
        deleted_at: { type: [string, 'null'], format: date-time }
        deleted_by: { type: [integer, 'null'], format: int64 }
        created_at: { type: string, format: date-time }
    MessageReply:
      type: object
      required: [id, sender_id, sender_email, sender_display_name, body, deleted]
      properties:
        id: { type: integer, format: int64 }
        sender_id: { type: integer, format: int64 }
        sender_email: { type: string }
        sender_display_name: { type: string }
        body: { type: string }
        deleted: { type: boolean }
    Attachment:
      type: object
      required: [id, organization_id, conversation_id, uploader_id, file_name, content_type, file_size, download_url, created_at]
      properties:
        id: { type: integer, format: int64 }
        organization_id: { type: integer, format: int64 }
