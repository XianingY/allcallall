openapi: 3.1.0
info:
  title: AllCallAll API
  version: 1.0.0
  description: Authoritative contract consumed by the primary Web client.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /auth/login:
    post:
      security: []
      operationId: login
      requestBody: { $ref: '#/components/requestBodies/Login' }
      responses:
        '200': { $ref: '#/components/responses/Auth' }
        '401': { $ref: '#/components/responses/Error' }
  /auth/register:
    post:
      security: []
      operationId: register
      requestBody: { $ref: '#/components/requestBodies/Register' }
      responses:
        '201': { $ref: '#/components/responses/Auth' }
        '400': { $ref: '#/components/responses/Error' }
  /auth/refresh:
    post:
      security: []
      operationId: refreshSession
      responses:
        '200': { $ref: '#/components/responses/Auth' }
        '401': { $ref: '#/components/responses/Error' }
  /auth/logout:
    post:
      security: []
      operationId: logout
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /auth/logout-all:
    post:
      operationId: logoutAll
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /auth/sessions:
    get:
      operationId: listRefreshSessions
      responses:
        '200':
          description: Active and historical browser sessions.
          content:
            application/json:
              schema:
                type: object
                required: [sessions]
                properties:
                  sessions: { type: array, items: { $ref: '#/components/schemas/RefreshSession' } }
  /auth/sessions/{sessionId}:
    delete:
      operationId: revokeRefreshSession
      parameters:
        - { name: sessionId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /auth/password-reset/send:
    post:
      security: []
      operationId: sendPasswordReset
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [email], properties: { email: { type: string, format: email } } } } }
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /auth/password-reset/confirm:
    post:
      security: []
      operationId: confirmPasswordReset
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PasswordResetRequest' } } }
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /email/send-verification-code:
    post:
      security: []
      operationId: sendVerificationCode
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/VerificationCodeRequest' } } }
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /email/verify-code:
    post:
      security: []
      operationId: verifyEmailCode
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/VerifyCodeRequest' } } }
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /users/me:
    get:
      operationId: getCurrentUser
      responses:
        '200':
          description: Current user.
          content: { application/json: { schema: { type: object, required: [user], properties: { user: { $ref: '#/components/schemas/User' } } } } }
  /users/change-password:
    post:
      operationId: changePassword
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /users/blocks:
    get:
      operationId: listBlocks
      responses:
        '200':
          description: Blocked users.
          content: { application/json: { schema: { type: object, required: [blocks], properties: { blocks: { type: array, items: { $ref: '#/components/schemas/UserBlock' } } } } } }
    post:
      operationId: blockUser
      responses: { '201': { $ref: '#/components/responses/Success' } }
  /users/blocks/{blockedUserId}:
    delete:
      operationId: unblockUser
      parameters:
        - { name: blockedUserId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /users/reports:
    post:
      operationId: reportUser
      responses: { '201': { $ref: '#/components/responses/Success' } }
  /users/me/deletion:
    post:
      operationId: deleteAccount
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /legal/current:
    get:
      security: []
      operationId: getCurrentLegal
      responses:
        '200':
          description: Current legal document versions and links.
          content: { application/json: { schema: { type: object, required: [legal], properties: { legal: { $ref: '#/components/schemas/LegalInfo' } } } } }
  /legal/accept:
    post:
      operationId: acceptCurrentLegal
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /organizations:
    get:
      operationId: listOrganizations
      responses:
        '200':
          description: Organizations.
          content: { application/json: { schema: { type: object, required: [organizations], properties: { organizations: { type: array, items: { $ref: '#/components/schemas/Organization' } } } } } }
    post:
      operationId: createOrganization
      responses:
        '201':
          description: Created organization.
          content: { application/json: { schema: { type: object, required: [organization], properties: { organization: { $ref: '#/components/schemas/Organization' } } } } }
  /organizations/{organizationId}/switch:
    post:
      operationId: switchOrganization
      parameters:
        - { name: organizationId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: Selected organization.
          content: { application/json: { schema: { type: object, required: [organization], properties: { organization: { $ref: '#/components/schemas/Organization' } } } } }
  /organizations/invites/{code}/accept:
    post:
      operationId: acceptOrganizationInvite
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /realtime/tickets:
    post:
      operationId: issueRealtimeTicket
      summary: Issue a 60-second, channel-bound, single-use WebSocket ticket.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channel]
              properties: { channel: { type: string, enum: [chat, signaling] } }
      responses:
        '201':
          description: Realtime ticket issued.
          content: { application/json: { schema: { $ref: '#/components/schemas/RealtimeTicket' } } }
  /webrtc/config:
    get:
      operationId: getWebRTCConfig
      responses:
        '200':
          description: ICE/TURN configuration.
          content:
            application/json:
              schema:
                type: object
                required: [ice_servers]
                properties:
                  ice_servers:
                    type: array
                    items:
                      type: object
                      required: [urls]
                      properties:
                        urls: { type: array, items: { type: string } }
                        username: { type: string }
                        credential: { type: string }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  requestBodies:
    Login:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/LoginRequest' } } }
    Register:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/RegisterRequest' } } }
  responses:
    Auth:
      description: Authenticated.
      content: { application/json: { schema: { $ref: '#/components/schemas/AuthResponse' } } }
    Error:
      description: Error.
      content: { application/json: { schema: { $ref: '#/components/schemas/APIError' } } }
    Success:
      description: Success.
      content: { application/json: { schema: { type: object, properties: { success: { type: boolean }, message: { type: string } } } } }
  schemas:
    APIError:
      type: object
      required: [success, error]
      properties:
        success: { type: boolean, const: false }
        code: { type: string }
        error: { type: string }
        request_id: { type: string }
    User:
      type: object
      required: [id, email, display_name]
      properties:
        id: { type: integer, format: int64 }
        email: { type: string, format: email }
        display_name: { type: string }
    Organization:
      type: object
      required: [id, name, role]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        slug: { type: string }
        description: { type: string }
        role: { type: string, enum: [owner, admin, member] }
    AuthResponse:
      type: object
      required: [user, access_token]
      properties:
        user: { $ref: '#/components/schemas/User' }
        access_token: { type: string }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    RegisterRequest:
      type: object
      required: [email, password, display_name, accept_current_legal]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
        display_name: { type: string }
        accept_current_legal: { type: boolean }
    VerificationCodeRequest:
      type: object
      required: [email, purpose]
      properties:
        email: { type: string, format: email }
        purpose: { type: string, enum: [register, password_reset, account_deletion] }
    VerifyCodeRequest:
      allOf:
        - { $ref: '#/components/schemas/VerificationCodeRequest' }
        - type: object
          required: [code]
          properties: { code: { type: string, pattern: '^[0-9]{6}$' } }
    PasswordResetRequest:
      type: object
      required: [email, code, new_password, confirm_password]
      properties:
        email: { type: string, format: email }
        code: { type: string }
        new_password: { type: string, minLength: 8 }
        confirm_password: { type: string, minLength: 8 }
    LegalInfo:
      type: object
      required: [terms_version, privacy_version, terms_url, privacy_policy_url, support_email, account_deletion_url]
      properties:
        terms_version: { type: string }
        privacy_version: { type: string }
        terms_url: { type: string }
        privacy_policy_url: { type: string }
        support_email: { type: string, format: email }
        account_deletion_url: { type: string }
    RefreshSession:
      type: object
      required: [id, status, current, user_agent, ip_address, expires_at, invalid_use_count, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        status: { type: string }
        current: { type: boolean }
        user_agent: { type: string }
        ip_address: { type: string }
        expires_at: { type: string, format: date-time }
        last_used_at: { type: [string, 'null'], format: date-time }
        revoked_at: { type: [string, 'null'], format: date-time }
        invalid_use_count: { type: integer }
        last_invalid_use_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    UserBlock:
      type: object
      required: [id, blocked_user_id, created_at]
      properties:
        id: { type: integer, format: int64 }
        blocked_user_id: { type: integer, format: int64 }
        blocked_user_email: { type: string }
        blocked_user_display_name: { type: string }
        blocked_user_status: { type: string }
        blocked_user_deleted_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
    Conversation:
      type: object
      required: [id, organization_id, type, title, status, priority, unread_count]
      properties:
        id: { type: integer, format: int64 }
        organization_id: { type: integer, format: int64 }
        team_id: { type: [integer, 'null'], format: int64 }
        room_id: { type: [integer, 'null'], format: int64 }
        type: { type: string }
        title: { type: string }
        topic: { type: string }
        status: { type: string }
        assignee_user_id: { type: [integer, 'null'], format: int64 }
        assignee_email: { type: string }
        assignee_display_name: { type: string }
        priority: { type: string }
        contact_id: { type: [integer, 'null'], format: int64 }
        last_internal_note_at: { type: [string, 'null'], format: date-time }
        last_message_at: { type: [string, 'null'], format: date-time }
        last_message_preview: { type: string }
        last_message_type: { type: string }
        unread_count: { type: integer }
        active_room_id: { type: [integer, 'null'], format: int64 }
        active_room_title: { type: string }
        latest_room_id: { type: [integer, 'null'], format: int64 }
        latest_room_title: { type: string }
        latest_recording_id: { type: [integer, 'null'], format: int64 }
    Message:
      type: object
      required: [id, organization_id, conversation_id, sender_id, sender_email, sender_display_name, type, body, created_at]
      properties:
        id: { type: integer, format: int64 }
        organization_id: { type: integer, format: int64 }
        conversation_id: { type: integer, format: int64 }
        sender_id: { type: integer, format: int64 }
        sender_email: { type: string }
        sender_display_name: { type: string }
        type: { type: string }
        body: { type: string }
        metadata: { type: object, additionalProperties: true }
        created_at: { type: string, format: date-time }
    ConversationNote:
      type: object
      required: [id, organization_id, conversation_id, author_id, author_email, author_display_name, body, created_at]
      properties:
        id: { type: integer, format: int64 }
        organization_id: { type: integer, format: int64 }
        conversation_id: { type: integer, format: int64 }
        author_id: { type: integer, format: int64 }
        author_email: { type: string }
        author_display_name: { type: string }
        body: { type: string }
        created_at: { type: string, format: date-time }
    ConversationDetail:
      type: object
      required: [conversation, workspace]
      properties:
        conversation: { $ref: '#/components/schemas/Conversation' }
        latest_note: { oneOf: [{ $ref: '#/components/schemas/ConversationNote' }, { type: 'null' }] }
        latest_followup: { type: [object, 'null'], additionalProperties: true }
        workspace:
          type: object
          required: [agent_context, status, priority]
          properties:
            latest_recording: { type: [object, 'null'], additionalProperties: true }
            meeting_summary: { type: [object, 'null'], additionalProperties: true }
            latest_note: { oneOf: [{ $ref: '#/components/schemas/ConversationNote' }, { type: 'null' }] }
            agent_context:
              type: object
              required: [transcript_segment_count]
              properties:
                transcript_segment_count: { type: integer }
                meeting_transcription_status: { type: string }
                meeting_transcription_error: { type: string }
                meeting_transcript_segment_count: { type: integer }
                latest_meeting_transcript_at: { type: [string, 'null'], format: date-time }
                last_agent_run_at: { type: [string, 'null'], format: date-time }
                last_agent_status: { type: string }
                pending_approval_count: { type: integer }
                knowledge_source_count: { type: integer }
                latest_memory_keys: { type: array, items: { type: string } }
            assignee_user_id: { type: [integer, 'null'], format: int64 }
            assignee_label: { type: string }
            status: { type: string }
            priority: { type: string }
    ContactProfile:
      type: object
      properties:
        company: { type: string }
        role: { type: string }
        timezone: { type: string }
        default_source_lang: { type: string }
        default_target_lang: { type: string }
        relationship_status: { type: string }
        preferred_contact_start: { type: string }
        preferred_contact_end: { type: string }
        preferred_contact_days: { type: string }
        last_followup_state: { type: string }
        note: { type: string }
    Contact:
      allOf:
        - { $ref: '#/components/schemas/User' }
        - type: object
          properties:
            status: { type: string }
            deleted_at: { type: [string, 'null'], format: date-time }
            profile: { $ref: '#/components/schemas/ContactProfile' }
    FollowUpTask:
      type: object
      required: [id, user_id, peer_user_id, type, status, title, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        user_id: { type: integer, format: int64 }
        peer_user_id: { type: integer, format: int64 }
        call_id: { type: string }
        type: { type: string }
        status: { type: string }
        title: { type: string }
        description: { type: string }
        due_at: { type: [string, 'null'], format: date-time }
        completed_at: { type: [string, 'null'], format: date-time }
        reminder_mode: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    FollowUpItem:
      type: object
      required: [task, is_overdue]
      properties:
        task: { $ref: '#/components/schemas/FollowUpTask' }
        peer: { oneOf: [{ $ref: '#/components/schemas/User' }, { type: 'null' }] }
        contact: { oneOf: [{ $ref: '#/components/schemas/ContactProfile' }, { type: 'null' }] }
        is_overdue: { type: boolean }
    PipelineStage:
      type: object
      required: [id, pipeline_id, name, position, is_closed]
      properties:
        id: { type: integer, format: int64 }
        pipeline_id: { type: integer, format: int64 }
        name: { type: string }
        position: { type: integer }
        is_closed: { type: boolean }
    Pipeline:
      type: object
      required: [id, organization_id, name, is_default, stages]
      properties:
        id: { type: integer, format: int64 }
        organization_id: { type: integer, format: int64 }
        name: { type: string }
        is_default: { type: boolean }
        stages: { type: array, items: { $ref: '#/components/schemas/PipelineStage' } }
    Deal:
      type: object
      required: [id, organization_id, pipeline_id, owner_id, title, status, value_cents, currency, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        organization_id: { type: integer, format: int64 }
        pipeline_id: { type: integer, format: int64 }
        stage_id: { type: [integer, 'null'], format: int64 }
        stage_name: { type: string }
        owner_id: { type: integer, format: int64 }
        title: { type: string }
        description: { type: string }
        status: { type: string }
        value_cents: { type: integer, format: int64 }
        currency: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    DealActivity:
      type: object
      required: [id, organization_id, deal_id, type, reference_type, reference_id, summary, created_by, created_at]
      properties:
        id: { type: integer, format: int64 }
        organization_id: { type: integer, format: int64 }
        deal_id: { type: integer, format: int64 }
        type: { type: string }
        reference_type: { type: string }
        reference_id: { type: string }
        summary: { type: string }
        metadata_json: { type: string }
        created_by: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
    CallHistory:
      type: object
      required: [id, call_id, caller_id, callee_id, caller_email, callee_email, caller_display_name, callee_display_name, status, end_reason, started_at]
      properties:
        id: { type: integer, format: int64 }
        call_id: { type: string }
        caller_id: { type: integer, format: int64 }
        callee_id: { type: integer, format: int64 }
        caller_email: { type: string }
        callee_email: { type: string }
        caller_display_name: { type: string }
        callee_display_name: { type: string }
        status: { type: string }
        end_reason: { type: string }
        started_at: { type: string, format: date-time }
        answered_at: { type: [string, 'null'], format: date-time }
        ended_at: { type: [string, 'null'], format: date-time }
        followup_status: { type: string }
        next_task_due_at: { type: [string, 'null'], format: date-time }
        is_overdue: { type: boolean }
    RealtimeTicket:
      type: object
      required: [ticket, channel, expires_at, websocket_path]
      properties:
        ticket: { type: string }
        channel: { type: string, enum: [chat, signaling] }
        expires_at: { type: string, format: date-time }
        websocket_path: { type: string }
    RoomMember:
      type: object
      required: [id, room_id, user_id, role]
      properties:
        id: { type: integer, format: int64 }
        room_id: { type: integer, format: int64 }
        user_id: { type: integer, format: int64 }
        role: { type: string }
        user_email: { type: string }
        user_display_name: { type: string }
        joined: { type: boolean }
        left: { type: boolean }
        audio_enabled: { type: boolean }
        video_enabled: { type: boolean }
        connection_state: { type: string }
        is_host: { type: boolean }
        joined_at: { type: [string, 'null'], format: date-time }
        left_at: { type: [string, 'null'], format: date-time }
    RecordingSession:
      type: object
      required: [id, organization_id, room_id, started_by, status, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        organization_id: { type: integer, format: int64 }
        room_id: { type: integer, format: int64 }
        started_by: { type: integer, format: int64 }
        status: { type: string }
        started_at: { type: [string, 'null'], format: date-time }
        stopped_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Room:
      type: object
      required: [room, members, events, participant_count, is_active, has_recording]
      properties:
        room:
          type: object
          required: [id, organization_id, title, status, created_by, created_at, updated_at]
          properties:
            id: { type: integer, format: int64 }
            organization_id: { type: integer, format: int64 }
            team_id: { type: [integer, 'null'], format: int64 }
            conversation_id: { type: [integer, 'null'], format: int64 }
            title: { type: string }
            status: { type: string }
            created_by: { type: integer, format: int64 }
            started_at: { type: [string, 'null'], format: date-time }
            ended_at: { type: [string, 'null'], format: date-time }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
        members: { type: array, items: { $ref: '#/components/schemas/RoomMember' } }
        events: { type: array, items: { type: object, additionalProperties: true } }
        active_recording: { oneOf: [{ $ref: '#/components/schemas/RecordingSession' }, { type: 'null' }] }
        conversation_id: { type: [integer, 'null'], format: int64 }
        conversation_title: { type: string }
        participant_count: { type: integer }
        is_active: { type: boolean }
        has_recording: { type: boolean }
        latest_recording_id: { type: [integer, 'null'], format: int64 }
    RecordingFile:
      type: object
      required: [id, recording_session_id, storage_driver, object_key, content_type, duration_seconds, created_at, download_url, file_name, file_size_bytes, recording_kind]
      properties:
        id: { type: integer, format: int64 }
        recording_session_id: { type: integer, format: int64 }
        storage_driver: { type: string }
        storage_bucket: { type: string }
        object_key: { type: string }
        etag: { type: string }
        content_type: { type: string }
        retention_until: { type: [string, 'null'], format: date-time }
        deleted_at: { type: [string, 'null'], format: date-time }
        duration_seconds: { type: number }
        metadata_json: { type: string }
        created_at: { type: string, format: date-time }
        download_url: { type: string }
        file_name: { type: string }
        file_size_bytes: { type: integer, format: int64 }
        recording_kind: { type: string }
    RecordingTranscription:
      type: object
      required: [id, status, segment_count, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        status: { type: string, enum: [pending, processing, ready, failed, skipped] }
        provider: { type: string }
        segment_count: { type: integer }
        error_message: { type: string }
