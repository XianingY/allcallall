# 水平自动伸缩：基于 CPU 与自定义 QPS 指标。
# 配合多 AZ 部署，扩容时新副本同样受 topologySpreadConstraints 约束跨 zone 打散。
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: allcallall-api
  namespace: allcallall
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: allcallall-api
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
    # 自定义指标（需部署 Prometheus Adapter，将 http_requests_total 暴露为 pods 指标）
    - type: Pods
      pods:
        metric:
          name: http_requests_per_second
        target:
          type: AverageValue
          averageValue: "100"
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 4
          periodSeconds: 30
