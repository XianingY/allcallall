# 敏感配置。生产环境请用 SealedSecret / ExternalSecrets / Vault 注入，
# 切勿将明文提交到仓库。此处为模板占位，部署前由 CI/安全流程填充。
apiVersion: v1
kind: Secret
metadata:
  name: allcallall-api
  namespace: allcallall
  annotations:
    # 若使用 External Secrets Operator：
    # externalsecrets.kubernetes.io/refresh-interval: "1h"
type: Opaque
stringData:
  # MySQL / Redis 凭据
  DB_USER: "allcallall_app"
  DB_PASSWORD: "CHANGE_ME_STRONG_PASSWORD"
  REDIS_PASSWORD: "CHANGE_ME_STRONG_PASSWORD"

  # 消息信封加密主密钥（KMS_PROVIDER=env 时启用；务必 32 字节 base64）
  MESSAGE_ENCRYPTION_MASTER_KEY: "CHANGE_ME_BASE64_32BYTES_KEY"

  # 合规标识
  ICP_LICENSE_NUMBER: "沪ICP备XXXXXXXX号-1"

  # 生成式 AI 算法备案号（CAC）
  AI_ALGORITHM_FILING_NUMBER: "网信算备XXXXXXXXXXXXXXXX号"

  # AIGC 水印 / 标识签名密钥
  AIGC_WATERMARK_KEY: "CHANGE_ME_WATERMARK_HMAC_KEY"

  # 内部服务间调用 / webhook 签名密钥
  INTERNAL_API_TOKEN: "CHANGE_ME_INTERNAL_TOKEN"
