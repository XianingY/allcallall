# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=conn:10m;

upstream backend {
    server backend:8080;
    keepalive 64;
    keepalive_timeout 60s;
    keepalive_requests 1000;
}

server {
    listen 80;
    server_name 121.40.22.172;
    
    location /api/v1/ws {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        keepalive_timeout 3600s;
    }

    # Health endpoint - no rate limit
    location = /api/v1/health {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # Keepalive to upstream
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Auth endpoints - strict rate limiting
    location /api/v1/auth/ {
        limit_req zone=auth burst=3 nodelay;
        limit_conn conn 10;
        
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # Keepalive to upstream
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # REST API 和信令端点 (包括 /api/v1/signaling/send, /api/v1/signaling/poll)
    location /api/v1/ {
        limit_req zone=api burst=20 nodelay;
        limit_conn conn 50;
        
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # Keepalive to upstream
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location = /config.js {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store" always;
        try_files /config.js =404;
    }

    location = /firebase-messaging-sw.js {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store" always;
        try_files /firebase-messaging-sw.js =404;
    }

    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store" always;
        try_files /index.html =404;
    }

    location /assets/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location ~ ^/rooms/([^/]+)/preflight$ {
        return 302 /meetings/$1/preflight;
    }

    location ~ ^/rooms/([^/]+)$ {
        return 302 /meetings/$1;
    }

    location = /agent-demo {
        return 302 /agent-lab;
    }

    location = /health {
        default_type text/plain;
        return 200 "OK";
    }

    location / {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ /index.html;
    }
}
