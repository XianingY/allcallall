apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "allcallall.fullname" . }}-web
  labels:
    {{- include "allcallall.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.components.web.replicas }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      {{- include "allcallall.selectorLabels" (dict "Release" .Release "Chart" .Chart "Values" .Values "component" "web") | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/web-config: {{ include (print .Template.BasePath "/web-config.yaml") . | sha256sum }}
      labels:
        {{- include "allcallall.selectorLabels" (dict "Release" .Release "Chart" .Chart "Values" .Values "component" "web") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "allcallall.serviceAccountName" (dict "root" . "component" "web") }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile: {type: RuntimeDefault}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: web
          image: "{{ .Values.images.web.repository }}:{{ .Values.images.web.tag }}"
          imagePullPolicy: {{ .Values.images.web.pullPolicy }}
          command: ["nginx", "-g", "daemon off;"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 101
            seccompProfile: {type: RuntimeDefault}
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet: {path: /health, port: http}
            failureThreshold: 20
            periodSeconds: 3
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.components.web.resources | nindent 12 }}
          volumeMounts:
            - name: web-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: web-config
              mountPath: /usr/share/nginx/html/config.js
              subPath: config.js
              readOnly: true
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: web-config
          configMap:
            name: {{ include "allcallall.fullname" . }}-web-config
        - name: nginx-cache
          emptyDir: {sizeLimit: 64Mi}
        - name: nginx-run
          emptyDir: {sizeLimit: 8Mi}
        - name: tmp
          emptyDir: {sizeLimit: 16Mi}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
