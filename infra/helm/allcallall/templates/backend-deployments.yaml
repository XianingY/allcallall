{{- $root := . }}
{{- $workloads := list
      (dict "name" "api" "values" .Values.components.api "command" (list) "http" true)
      (dict "name" "agent-worker" "values" .Values.components.agentWorker "command" (list "/app/agent-worker") "http" false)
      (dict "name" "outbox-worker" "values" .Values.components.outboxWorker "command" (list "/app/outbox-worker") "http" false)
}}
{{- range $workload := $workloads }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "allcallall.componentName" (dict "root" $root "component" $workload.name) }}
  labels:
    {{- include "allcallall.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $workload.name }}
spec:
  replicas: {{ $workload.values.replicas }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      {{- include "allcallall.selectorLabels" (dict "Release" $root.Release "Chart" $root.Chart "Values" $root.Values "component" $workload.name) | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $root.Template.BasePath "/configmap.yaml") $root | sha256sum }}
        {{- if and $workload.http $root.Values.observability.prometheus.scrape }}
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /api/v1/metrics
        {{- end }}
        {{- with $root.Values.global.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "allcallall.selectorLabels" (dict "Release" $root.Release "Chart" $root.Chart "Values" $root.Values "component" $workload.name) | nindent 8 }}
        {{- with $root.Values.global.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "allcallall.serviceAccountName" (dict "root" $root "component" $workload.name) }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      {{- with $root.Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ $workload.name }}
          image: "{{ $root.Values.images.backend.repository }}:{{ $root.Values.images.backend.tag }}"
          imagePullPolicy: {{ $root.Values.images.backend.pullPolicy }}
          {{- with $workload.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            {{- include "allcallall.containerSecurityContext" $root | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ include "allcallall.fullname" $root }}-config
          env:
            {{- include "allcallall.backendSecretEnv" $root | nindent 12 }}
            - name: CONFIG_PATH
              value: /app/configs/config.yaml
            - name: HTTP_PORT
              value: "8080"
            - name: EMBEDDED_WORKERS
              value: "0"
            - name: AGENT_RUNTIME
              value: python_langgraph
            - name: PY_AGENT_RUNTIME_BASE_URL
              value: http://{{ include "allcallall.fullname" $root }}-agent-runtime:8090
            - name: PY_RAG_RUNTIME_BASE_URL
              value: http://{{ include "allcallall.fullname" $root }}-rag-runtime:8091
            - name: SANDBOX_CONTROL_PLANE_URL
              value: http://{{ include "allcallall.fullname" $root }}-sandbox-control-plane:8092
            - name: OTEL_SERVICE_NAME
              value: allcallall-{{ $workload.name }}
            {{- if and $root.Values.features.mcpPlatformEnabled (or (eq $workload.name "api") (eq $workload.name "agent-worker")) }}
            - name: OPENBAO_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $root.Values.external.openbao.secretName }}
                  key: {{ $root.Values.external.openbao.tokenKey }}
                  optional: true
            - name: MCP_CAPABILITY_ED25519_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $root.Values.external.mysql.secretName }}
                  key: {{ $root.Values.external.mysql.mcpCapabilityPrivateKeyKey }}
            - name: SANDBOX_CAPABILITY_ED25519_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $root.Values.external.mysql.secretName }}
                  key: {{ $root.Values.external.mysql.sandboxCapabilityPublicKeyKey }}
            {{- end }}
          {{- if $workload.http }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet: {path: /api/v1/health, port: http}
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet: {path: /api/v1/health, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /api/v1/health, port: http}
            initialDelaySeconds: 20
            periodSeconds: 20
          {{- end }}
          resources:
            {{- toYaml $workload.values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
      terminationGracePeriodSeconds: 30
      {{- with $root.Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $root.Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $root.Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
