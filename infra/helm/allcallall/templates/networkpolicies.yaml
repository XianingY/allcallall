---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "allcallall.fullname" . }}-backend-mysql-external
  labels:
    {{- include "allcallall.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "allcallall.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: [api, agent-worker, outbox-worker, migration, sandbox-control-plane]
  policyTypes: [Egress]
  egress:
    {{- range .Values.external.mysql.egressCIDRs }}
    - to: [{ipBlock: {cidr: {{ . | quote }}}}]
      ports: [{protocol: TCP, port: 3306}]
    {{- end }}

