apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "allcallall.fullname" . }}-config
  labels:
    {{- include "allcallall.labels" . | nindent 4 }}
data:
  APP_ENV: {{ .Values.global.environment | quote }}
  REDIS_ADDR: {{ .Values.external.redis.address | quote }}
  OPENBAO_ADDR: {{ .Values.external.openbao.address | quote }}
  MCP_PLATFORM_ENABLED: {{ .Values.features.mcpPlatformEnabled | quote }}
  SANDBOX_EXECUTION_ENABLED: {{ .Values.features.sandboxExecutionEnabled | quote }}
  LANGGRAPH_MYSQL_CHECKPOINT_ENABLED: {{ .Values.features.langgraphMysqlCheckpointEnabled | quote }}
  LEGACY_GO_RUNTIME_ENABLED: {{ .Values.features.legacyGoRuntimeEnabled | quote }}
  MCP_PERSONAL_INSTALLATION_LIMIT: {{ .Values.platform.limits.personalInstallationsPerUser | quote }}
  MCP_ORGANIZATION_INSTALLATION_LIMIT: {{ .Values.platform.limits.publishedInstallationsPerOrganization | quote }}
  MCP_USER_CONCURRENCY_LIMIT: {{ .Values.platform.limits.concurrentExecutionsPerUser | quote }}
  MCP_ORGANIZATION_CONCURRENCY_LIMIT: {{ .Values.platform.limits.concurrentExecutionsPerOrganization | quote }}
  MCP_EXECUTION_TIMEOUT_SECONDS: {{ .Values.platform.limits.executionTimeoutSeconds | quote }}
  MCP_EXECUTION_CPU_LIMIT: {{ .Values.platform.limits.executionCPU | quote }}
  MCP_EXECUTION_MEMORY_LIMIT: {{ .Values.platform.limits.executionMemory | quote }}
  MCP_MAXIMUM_OUTPUT_BYTES: {{ .Values.platform.limits.maximumOutputBytes | quote }}
  CHECKPOINT_PAYLOAD_RETENTION_DAYS: {{ .Values.platform.retention.checkpointPayloadDays | quote }}
  TOOL_PAYLOAD_RETENTION_DAYS: {{ .Values.platform.retention.toolPayloadDays | quote }}
  ORGANIZATION_AUDIT_RETENTION_DAYS: {{ .Values.platform.retention.organizationAuditDays | quote }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.observability.otlpEndpoint | quote }}
  # HPA External metrics are consumed through the Kubernetes custom-metrics API,
  # not by these worker environment variables. Install and configure a Prometheus
  # custom-metrics adapter before setting components.*.autoscaling.externalMetrics.
  OUTBOX_WORKER_IDLE_MS: {{ .Values.workers.outbox.idleMs | quote }}
  OUTBOX_WORKER_ERROR_BACKOFF_MS: {{ .Values.workers.outbox.errorBackoffMs | quote }}
  OUTBOX_WORKER_LEASE_SEC: {{ .Values.workers.outbox.leaseSec | quote }}
  OUTBOX_WORKER_LEASE_REFRESH_SEC: {{ .Values.workers.outbox.leaseRefreshSec | quote }}
  AGENT_WORKER_CONCURRENCY: {{ .Values.workers.agent.concurrency | quote }}
  AGENT_WORKER_QUEUE_DEPTH: {{ .Values.workers.agent.queueDepth | quote }}
  COLLABORATION_WORKER_CONCURRENCY: {{ .Values.workers.collaboration.concurrency | quote }}
  COLLABORATION_WORKER_QUEUE_DEPTH: {{ .Values.workers.collaboration.queueDepth | quote }}
  SEARCH_WORKER_CONCURRENCY: {{ .Values.workers.search.concurrency | quote }}
  SEARCH_WORKER_QUEUE_DEPTH: {{ .Values.workers.search.queueDepth | quote }}
  SETTLEMENT_WORKER_CONCURRENCY: {{ .Values.workers.settlement.concurrency | quote }}
  SETTLEMENT_WORKER_QUEUE_DEPTH: {{ .Values.workers.settlement.queueDepth | quote }}
  PY_AGENT_RUNTIME_CONNECT_TIMEOUT_SEC: {{ .Values.runtime.connectTimeoutSec | quote }}
  PY_AGENT_RUNTIME_RESPONSE_HEADER_TIMEOUT_SEC: {{ .Values.runtime.responseHeaderTimeoutSec | quote }}
  PY_AGENT_RUNTIME_IDLE_CONN_TIMEOUT_SEC: {{ .Values.runtime.idleConnTimeoutSec | quote }}
  PY_AGENT_RUNTIME_TIMEOUT_SEC: {{ .Values.runtime.timeoutSec | quote }}
  PY_AGENT_RUNTIME_MAX_IDLE_CONNS: {{ .Values.runtime.maxIdleConns | quote }}
  PY_AGENT_RUNTIME_MAX_IDLE_CONNS_PER_HOST: {{ .Values.runtime.maxIdleConnsPerHost | quote }}
  PY_AGENT_RUNTIME_MAX_CONNS_PER_HOST: {{ .Values.runtime.maxConnsPerHost | quote }}
  PY_AGENT_RUNTIME_CANCELLATION_GRACE_SEC: {{ .Values.runtime.cancellationGraceSec | quote }}
  AGENT_RUN_LEASE_DURATION_SEC: {{ .Values.leases.agentRunLeaseSec | quote }}
  WORKFLOW_RUN_LEASE_DURATION_SEC: {{ .Values.leases.workflowRunLeaseSec | quote }}
  OUTBOX_PERSISTENCE_GRACE_SEC: {{ .Values.leases.outboxPersistenceGraceSec | quote }}
