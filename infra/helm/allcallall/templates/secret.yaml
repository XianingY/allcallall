{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.external.mysql.secretName }}
  labels:
    {{- include "allcallall.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
type: Opaque
stringData:
  {{ .Values.external.mysql.dsnKey }}: {{ required "secrets.mysqlDsn is required when secrets.create=true" .Values.secrets.mysqlDsn | quote }}
  {{ .Values.external.mysql.checkpointDsnKey }}: {{ required "secrets.checkpointMysqlDsn is required when secrets.create=true" .Values.secrets.checkpointMysqlDsn | quote }}
  {{ .Values.external.mysql.sandboxReceiptDsnKey }}: {{ required "secrets.sandboxReceiptMysqlDsn is required when secrets.create=true" .Values.secrets.sandboxReceiptMysqlDsn | quote }}
  {{- if .Values.features.mcpPlatformEnabled }}
  {{ .Values.external.mysql.mcpCapabilityPrivateKeyKey }}: {{ required "secrets.mcpCapabilityPrivateKey is required when secrets.create=true and MCP is enabled" .Values.secrets.mcpCapabilityPrivateKey | quote }}
  {{- else }}
  {{ .Values.external.mysql.mcpCapabilityPrivateKeyKey }}: {{ .Values.secrets.mcpCapabilityPrivateKey | quote }}
  {{- end }}
  {{ .Values.external.mysql.sandboxCapabilityPublicKeyKey }}: {{ required "secrets.sandboxCapabilityPublicKey is required when secrets.create=true because the Sandbox Control Plane is deployed" .Values.secrets.sandboxCapabilityPublicKey | quote }}
  {{ .Values.external.redis.passwordKey }}: {{ .Values.secrets.redisPassword | quote }}
  {{ .Values.external.openbao.tokenKey }}: {{ .Values.secrets.openbaoToken | quote }}
{{- end }}
