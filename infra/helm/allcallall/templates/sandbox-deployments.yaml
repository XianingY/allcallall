{{- $root := . }}
{{- $sandboxes := list
      (dict "name" "sandbox-control-plane" "values" .Values.components.sandboxControlPlane "image" .Values.images.sandboxControlPlane "port" 8092 "user" 65532)
      (dict "name" "sandbox-runner" "values" .Values.components.sandboxRunner "image" .Values.images.sandboxRunner "port" 8093 "user" 10001)
}}
{{- range $sandbox := $sandboxes }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "allcallall.componentName" (dict "root" $root "component" $sandbox.name) }}
  labels:
    {{- include "allcallall.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $sandbox.name }}
spec:
  replicas: {{ $sandbox.values.replicas }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      {{- include "allcallall.selectorLabels" (dict "Release" $root.Release "Chart" $root.Chart "Values" $root.Values "component" $sandbox.name) | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $root.Template.BasePath "/configmap.yaml") $root | sha256sum }}
      labels:
        {{- include "allcallall.selectorLabels" (dict "Release" $root.Release "Chart" $root.Chart "Values" $root.Values "component" $sandbox.name) | nindent 8 }}
    spec:
      runtimeClassName: {{ $sandbox.values.runtimeClassName | quote }}
      serviceAccountName: {{ include "allcallall.serviceAccountName" (dict "root" $root "component" $sandbox.name) }}
      automountServiceAccountToken: {{ eq $sandbox.name "sandbox-control-plane" }}
      hostNetwork: false
      hostPID: false
      hostIPC: false
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ $sandbox.user }}
        runAsGroup: {{ $sandbox.user }}
        fsGroup: {{ $sandbox.user }}
        seccompProfile: {type: RuntimeDefault}
      {{- with $root.Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ $sandbox.name }}
          image: "{{ $sandbox.image.repository }}:{{ $sandbox.image.tag }}"
          imagePullPolicy: {{ $sandbox.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: {{ $sandbox.user }}
            seccompProfile: {type: RuntimeDefault}
          envFrom:
            - configMapRef:
                name: {{ include "allcallall.fullname" $root }}-config
          env:
            {{- if eq $sandbox.name "sandbox-control-plane" }}
            - name: SANDBOX_ADDR
              value: :8092
            - name: SANDBOX_RUNNER_URL
              value: http://{{ include "allcallall.fullname" $root }}-sandbox-runner:8093
            - name: SANDBOX_KUBERNETES_EXECUTION_ENABLED
              value: {{ ternary "1" "0" (and $root.Values.features.sandboxExecutionEnabled $root.Values.components.sandboxJobs.enabled) | quote }}
            - name: SANDBOX_JOB_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: SANDBOX_JOB_RUNNER_IMAGE
              value: "{{ $root.Values.images.sandboxRunner.repository }}:{{ $root.Values.images.sandboxRunner.tag }}"
            - name: SANDBOX_JOB_SUPERVISOR_IMAGE
              value: "{{ $root.Values.images.sandboxSupervisor.repository }}:{{ $root.Values.images.sandboxSupervisor.tag }}"
            - name: SANDBOX_JOB_IMAGE_PULL_SECRETS
              value: {{ $root.Values.global.imagePullSecrets | toJson | quote }}
            - name: SANDBOX_JOB_RUNTIME_CLASS
              value: {{ $root.Values.components.sandboxJobs.runtimeClassName | quote }}
            - name: SANDBOX_JOB_SERVICE_ACCOUNT
              value: {{ include "allcallall.serviceAccountName" (dict "root" $root "component" "sandbox-job") | quote }}
            - name: SANDBOX_JOB_APP_NAME
              value: {{ include "allcallall.name" $root | quote }}
            - name: SANDBOX_JOB_INSTANCE
              value: {{ $root.Release.Name | quote }}
            - name: SANDBOX_JOB_CPU
              value: {{ $root.Values.components.sandboxJobs.resources.cpu | quote }}
            - name: SANDBOX_JOB_MEMORY
              value: {{ $root.Values.components.sandboxJobs.resources.memory | quote }}
            - name: SANDBOX_JOB_STARTUP_TIMEOUT
              value: {{ $root.Values.components.sandboxJobs.startupTimeout | quote }}
            - name: SANDBOX_DB_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ $root.Values.external.mysql.secretName }}
                  key: {{ $root.Values.external.mysql.sandboxReceiptDsnKey }}
            - name: SANDBOX_CAPABILITY_ED25519_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $root.Values.external.mysql.secretName }}
                  key: {{ $root.Values.external.mysql.sandboxCapabilityPublicKeyKey }}
            - name: TRIVY_CACHE_DIR
              value: /tmp/trivy-cache
            {{- else }}
            - name: SANDBOX_ALLOW_STDIO
              value: {{ ternary "1" "0" $root.Values.components.sandboxRunner.allowStdio | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ $sandbox.port }}
          startupProbe:
            httpGet: {path: /health, port: http}
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml $sandbox.values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: runtime-secrets
              mountPath: /run/secrets
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi
        - name: runtime-secrets
          emptyDir:
            medium: Memory
            sizeLimit: 2Mi
      terminationGracePeriodSeconds: 15
      {{- with $root.Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $root.Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $root.Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
