apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "allcallall.fullname" . }}-web-config
  labels:
    {{- include "allcallall.labels" . | nindent 4 }}
data:
  default.conf: |
    server {
      listen 8080;
      server_name _;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header X-Frame-Options "DENY" always;
      location ~ ^/api/v1/(ws|chat/ws)$ {
        proxy_pass http://{{ include "allcallall.fullname" . }}-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
      }
      location /api/v1/ {
        proxy_pass http://{{ include "allcallall.fullname" . }}-api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
      }
      location = /health {
        default_type text/plain;
        return 200 "OK";
      }
      location = /config.js {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store" always;
      }
      location /assets/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
      }
      location / {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ /index.html;
      }
    }
  config.js: |
    window.__ALLCALLALL_CONFIG__ = {
      apiBaseUrl: {{ .Values.components.web.publicApiBaseUrl | quote }},
      wsBaseUrl: {{ .Values.components.web.publicWsBaseUrl | quote }}
    };
