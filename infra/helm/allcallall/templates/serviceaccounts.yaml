{{- if .Values.serviceAccount.create }}
{{- $root := . }}
{{- range $component := list "api" "agent-worker" "outbox-worker" "agent-runtime" "rag-runtime" "sandbox-control-plane" "sandbox-runner" "web" "migration" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "allcallall.serviceAccountName" (dict "root" $root "component" $component) }}
  labels:
    {{- include "allcallall.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
  {{- if eq $component "migration" }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
  {{- else }}
  {{- with $root.Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
{{- end }}
