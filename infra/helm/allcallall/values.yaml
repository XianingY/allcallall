nameOverride: ""
fullnameOverride: ""

global:
  environment: production
  imagePullSecrets: []
  podAnnotations: {}
  podLabels: {}

images:
  backend:
    repository: ghcr.io/xianingy/allcallall/backend
    tag: v0.3.0
    pullPolicy: IfNotPresent
  agentRuntime:
    repository: ghcr.io/xianingy/allcallall-agent-runtime/agent-runtime
    tag: v0.3.0
    pullPolicy: IfNotPresent
  ragRuntime:
    repository: ghcr.io/xianingy/allcallall-agent-runtime/rag-runtime
    tag: v0.3.0
    pullPolicy: IfNotPresent
  sandboxControlPlane:
    repository: ghcr.io/xianingy/allcallall/sandbox-control-plane
    tag: v0.3.0
    pullPolicy: IfNotPresent
  sandboxRunner:
    repository: ghcr.io/xianingy/allcallall/sandbox-runner
    tag: v0.3.0
    pullPolicy: IfNotPresent
  sandboxSupervisor:
    repository: ghcr.io/xianingy/allcallall/sandbox-supervisor
    tag: v0.3.0
    pullPolicy: IfNotPresent
  web:
    repository: ghcr.io/xianingy/allcallall/web
    tag: v0.3.0
    pullPolicy: IfNotPresent

# All databases and secret stores are external to this chart. Create the named
# Secret before installation, or enable secrets.create only for disposable environments.
external:
  mysql:
    secretName: allcallall-external
    dsnKey: mysql-dsn
    checkpointDsnKey: checkpoint-mysql-dsn
    sandboxReceiptDsnKey: sandbox-receipt-mysql-dsn
    mcpCapabilityPrivateKeyKey: mcp-capability-ed25519-private-key
    sandboxCapabilityPublicKeyKey: sandbox-capability-ed25519-public-key
    egressCIDRs: []
  redis:
    address: redis.example.internal:6379
    secretName: allcallall-external
    passwordKey: redis-password
    egressCIDRs: []
  openbao:
    address: https://openbao.example.internal:8200
    secretName: allcallall-external
    tokenKey: openbao-token
    egressCIDRs: []
  # Provider, HTTPS MCP, object storage and image registry destinations.
  providerEgressCIDRs: []
  mcpEgressCIDRs: []
  registryEgressCIDRs: []
  # ClusterIP or control-plane addresses used by the in-cluster Kubernetes API.
  kubernetesApiCIDRs: []

secrets:
  create: false
  # Development convenience only. Use an external secret controller in production.
  mysqlDsn: ""
  checkpointMysqlDsn: ""
  sandboxReceiptMysqlDsn: ""
  # Generate the matching private seed/public key pair with:
  # ./scripts/development/generate-agent-capability-keypair.sh
  mcpCapabilityPrivateKey: ""
  # Matching base64-encoded 32-byte Ed25519 public key.
  sandboxCapabilityPublicKey: ""
  redisPassword: ""
  openbaoToken: ""

# Firebase Cloud Messaging, required for incoming call notifications.
#
# The backend now refuses to start when FCM_SERVICE_ACCOUNT_PATH is missing in a
# real deployment (APP_ENV=production/beta or GIN_MODE=release). It used to start
# anyway and drop every notification: the send path returns nil without touching
# the network, so the count of "sent" devices climbed and the log reported
# success while no phone rang.
#
# Create the Secret out of band so the credential never lands in git:
#   kubectl -n allcallall create secret generic allcallall-fcm \
#     --from-file=service-account.json=/path/to/firebase-service-account.json
fcm:
  # Turn on together with existingSecret. Leave off for environments that do not
  # receive calls, so they can run without a Firebase project.
  enabled: false
  existingSecret: allcallall-fcm
  existingSecretKey: service-account.json
  # Mounted read-only; the file name inside the Secret is derived from this path.
  serviceAccountPath: /etc/fcm/firebase-service-account.json

features:
  mcpPlatformEnabled: true
  sandboxExecutionEnabled: true
  langgraphMysqlCheckpointEnabled: true
  legacyGoRuntimeEnabled: true

platform:
  limits:
    personalInstallationsPerUser: 5
    publishedInstallationsPerOrganization: 20
    concurrentExecutionsPerUser: 2
    concurrentExecutionsPerOrganization: 10
    executionTimeoutSeconds: 30
    executionCPU: 500m
    executionMemory: 512Mi
    maximumOutputBytes: 262144
  retention:
    checkpointPayloadDays: 30
    toolPayloadDays: 30
    organizationAuditDays: 180

observability:
  otlpEndpoint: ""
  otlpEgressCIDRs: []
  prometheus:
    scrape: true
    namespace: monitoring

# Outbox worker parallelism and timing. Concurrency is clamped to [1, 64];
# queue depth to [concurrency, 1024]. Lease refresh defaults to lease/3.
# Per-worker concurrency/queueDepth override the code defaults; idle/error/lease
# timing is shared across all workers.
workers:
  outbox:
    idleMs: 500
    errorBackoffMs: 1000
    leaseSec: 360
    leaseRefreshSec: 40
  agent:
    concurrency: 2
    queueDepth: 4
  collaboration:
    concurrency: 8
    queueDepth: 16
  search:
    concurrency: 4
    queueDepth: 8
  settlement:
    concurrency: 2
    queueDepth: 4

# Python LangGraph runtime HTTP transport timeouts and connection limits.
# The duration hierarchy is validated at startup:
#   connect < response-header < total (Python request deadline)
#   total + cancellation grace < agent/workflow execution lease
#   outbox lease > execution lease + persistence grace
runtime:
  connectTimeoutSec: 10
  responseHeaderTimeoutSec: 30
  idleConnTimeoutSec: 90
  timeoutSec: 60
  maxIdleConns: 100
  maxIdleConnsPerHost: 10
  maxConnsPerHost: 20
  cancellationGraceSec: 30

# Execution lease durations and persistence grace. These must satisfy the
# hierarchy validated at startup (see runtime config above).
leases:
  agentRunLeaseSec: 300
  workflowRunLeaseSec: 300
  outboxPersistenceGraceSec: 30

serviceAccount:
  create: true
  # Shared pre-created account used when create=false. Empty selects "default".
  name: ""
  annotations: {}

backend:
  shutdown:
    # Paused between the Pod being marked for deletion and SIGTERM, so endpoint
    # removal can propagate before anything closes. Rolling updates used to cut
    # every realtime connection because sockets were closed the instant SIGTERM
    # arrived.
    preStopSeconds: 5
    # How long the process waits after failing readiness before draining. Shutdown
    # fails /ready so the endpoint slice drops this Pod, then waits this long for
    # that to happen before closing sockets.
    drainDelay: 5s

components:
  api:
    replicas: 2
    resources:
      requests: {cpu: 250m, memory: 256Mi}
      limits: {cpu: "1", memory: 1Gi}
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 10
      targetCPUUtilizationPercentage: 70
      scaleDownStabilizationWindowSeconds: 300
      # Optional External metrics require a Prometheus custom-metrics adapter.
      # Keep the CPU metric enabled even when pressure metrics are configured.
      externalMetrics: []
    pdb: {enabled: true, minAvailable: 1}
  agentWorker:
    replicas: 2
    resources:
      requests: {cpu: 200m, memory: 256Mi}
      limits: {cpu: "1", memory: 1Gi}
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 10
      targetCPUUtilizationPercentage: 70
      scaleDownStabilizationWindowSeconds: 300
      # Production pressure-scaling example. The adapter metric must filter
      # pending rows to the agent worker event classes; a global oldest-age
      # value can scale the wrong worker.
      # externalMetrics:
      #   - name: allcallall_agent_outbox_oldest_pending_seconds
      #     targetAverageValue: "2"
      externalMetrics: []
    pdb: {enabled: true, minAvailable: 1}
  outboxWorker:
    replicas: 2
    resources:
      requests: {cpu: 150m, memory: 192Mi}
      limits: {cpu: 750m, memory: 768Mi}
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 8
      targetCPUUtilizationPercentage: 70
      scaleDownStabilizationWindowSeconds: 300
      # Production pressure-scaling example. The adapter metric must filter
      # pending rows to this worker's event classes; otherwise leave
      # externalMetrics empty and use the CPU signal.
      # externalMetrics:
      #   - name: allcallall_outbox_oldest_pending_seconds
      #     targetAverageValue: "2"
      externalMetrics: []
    pdb: {enabled: true, minAvailable: 1}
  agentRuntime:
    replicas: 2
    resources:
      requests: {cpu: 250m, memory: 512Mi}
      limits: {cpu: "1", memory: 2Gi}
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 12
      targetCPUUtilizationPercentage: 65
      scaleDownStabilizationWindowSeconds: 300
      # Production pressure-scaling example. The adapter maps this to the
      # agent_runtime_admission_queued_runs Prometheus gauge.
      # externalMetrics:
      #   - name: allcallall_agent_admission_queue_depth
      #     targetAverageValue: "4"
      externalMetrics: []
    pdb: {enabled: true, minAvailable: 1}
  ragRuntime:
    replicas: 2
    resources:
      requests: {cpu: 250m, memory: 512Mi}
      limits: {cpu: "1", memory: 2Gi}
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 12
      targetCPUUtilizationPercentage: 65
      scaleDownStabilizationWindowSeconds: 300
      externalMetrics: []
    pdb: {enabled: true, minAvailable: 1}
  sandboxControlPlane:
    replicas: 2
    runtimeClassName: gvisor
    resources:
      requests: {cpu: 250m, memory: 512Mi}
      limits: {cpu: "1", memory: 1Gi}
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 10
      targetCPUUtilizationPercentage: 60
      scaleDownStabilizationWindowSeconds: 300
      externalMetrics: []
    pdb: {enabled: true, minAvailable: 1}
  sandboxRunner:
    replicas: 2
    runtimeClassName: gvisor
    allowStdio: false
    resources:
      requests: {cpu: 100m, memory: 128Mi}
      limits: {cpu: 500m, memory: 512Mi}
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 20
      targetCPUUtilizationPercentage: 60
      scaleDownStabilizationWindowSeconds: 300
      externalMetrics: []
    pdb: {enabled: true, minAvailable: 1}
  sandboxJobs:
    enabled: true
    runtimeClassName: gvisor
    startupTimeout: 30s
    resources:
      cpu: 500m
      memory: 512Mi
  web:
    replicas: 2
    publicApiBaseUrl: /api/v1
    publicWsBaseUrl: ""
    resources:
      requests: {cpu: 50m, memory: 64Mi}
      limits: {cpu: 250m, memory: 256Mi}
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 6
      targetCPUUtilizationPercentage: 70
      scaleDownStabilizationWindowSeconds: 300
      externalMetrics: []
    pdb: {enabled: true, minAvailable: 1}

migration:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}

# Automated MySQL backups. Enabled by default because a backup that nobody
# scheduled is the same as having no backup - the script has always existed,
# it just never ran. Disable only if you ship dumps from elsewhere.
backup:
  enabled: true
  # Daily at 03:00 UTC. `Forbid` concurrency means a slow run never overlaps.
  schedule: "0 3 * * *"
  timeZone: "UTC"
  image:
    repository: mysql
    # Pinned by digest as well as tag. A tag is mutable: whoever controls the
    # registry can repoint it at different content, so the digest is what makes
    # the backup image reproducible and the Trivy scan meaningful (it scanned
    # this content, not "whatever 8.4 means today").
    #
    # To update: docker buildx imagetools inspect mysql:<new-version>, then
    # replace both the tag and the digest here.
    tag: "8.4@sha256:6ea90827b1100f8f2ae306a539f86d2c264a26ed435a2a9f75551dd5c3aeb242"
    pullPolicy: IfNotPresent
  dir: /var/backups/allcallall
  retainDays: 30
  # Fail the job when the archive is suspiciously small - an empty dump that
  # reports success is worse than no backup, because it only surfaces on restore.
  minDumpBytes: 1024
  # Optional offsite copy, e.g. "rclone copy %s remote:allcallall-backups".
  # Non-fatal: a flaky object store must not fail an otherwise good backup.
  offsiteCmd: ""
  backoffLimit: 2
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  persistence:
    enabled: true
    size: 20Gi
    accessModes: [ReadWriteOnce]
    # Empty string uses the cluster default StorageClass.
    storageClassName: ""
  # Used for /tmp and for the backup volume when persistence is disabled.
  ephemeralSizeLimit: 2Gi
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: 500m, memory: 1Gi}

networkPolicy:
  enabled: true
  ingressControllerNamespace: ingress-nginx
  dnsNamespace: kube-system
  dnsPodLabels:
    k8s-app: kube-dns
  # Allow Prometheus to scrape the standard registry endpoint (9090).
  # Off by default: enabling it without a namespace would expose the metrics
  # port to the whole cluster. Fill in the namespace, and podLabels if you
  # want to narrow it further, then turn it on. See docs/observability.md.
  prometheus:
    # 9090 is scraped through this path; see networkpolicies.yaml. Note the
    # inconsistency worth fixing separately: observability.prometheus.scrape
    # annotates only the 8080 text endpoint, so with this false Prometheus does
    # not see the Go runtime metrics on 9090 either.
    enabled: false
    namespace: monitoring
    podLabels: {}

# Node-level log forwarding to Loki.
#
# Until now the only promtail config in the repository used docker_sd_configs,
# which discovers nothing in a Kubernetes cluster - so a cluster deployment
# shipped with a Loki datasource wired up and no data behind it. An incident
# would have had dashboards but no evidence.
#
# Loki itself is not part of this chart; point lokiUrl at wherever you run it.
logging:
  enabled: true
  lokiUrl: http://loki:3100/loki/api/v1/push
  image:
    repository: grafana/promtail
    tag: 3.5.5
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi
  # Escape hatch for node-level files outside /var/log/containers, e.g. kernel
  # messages or a kubelet log. Structured as additional promtail scrape_configs.
  extraScrapeConfigs: []

ingress:
  enabled: false
  className: nginx
  annotations: {}
  webHost: app.example.com
  apiHost: api.example.com
  tls: []

nodeSelector: {}
tolerations: []
affinity: {}
