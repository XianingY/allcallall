# AllCallAll — ModSecurity / OWASP CRS 补充规则
#
# 适用于反向代理（nginx + mod_security3 / Coraza）前置的 WAF。本文件为
# OWASP CRS 之上的 *应用专属* 补充规则，应在加载 CRS 后 include。
#
# 启用（nginx 示例）：
#   modsecurity on;
#   modsecurity_rules_file /etc/modsecurity/crs-setup.conf;
#   modsecurity_rules_file /etc/modsecurity/modsecurity.conf;
#   modsecurity_rules_file /etc/modsecurity/allcallall-rules.conf;  # 本文件
#
# 阶段说明（SecRulePhase）：
#   1=请求头 2=请求体 3=响应头 4=响应体 5=日志

# ---- 基础加固：缺失 UA 的 API 请求 ----
SecRule REQUEST_URI "@rx ^/api/" \
    "id:10001,phase:1,t:none,deny,status:403,log,msg:'API request without User-Agent',chain"
    SecRule &REQUEST_HEADERS:User-Agent "@eq 0"

# ---- OWASP A03: SQL 注入（聊天/认证参数） ----
SecRule REQUEST_COOKIES|REQUEST_COOKIES_NAMES|REQUEST_FILENAME|REQUEST_HEADERS|REQUEST_LINE|REQUEST_URI|REQUEST_BODY \
    "@detectSQLi" \
    "id:10010,phase:2,t:none,t:lowercase,deny,status:403,log,msg:'AllCallAll: SQL injection attempt',tag:'attack-sqli'"

# ---- OWASP A01: 路径穿越 / LFI ----
SecRule REQUEST_URI|REQUEST_BODY \
    "@rx (?:\.\./|%2e%2e|/etc/passwd|/proc/self|boot.ini)" \
    "id:10020,phase:2,t:none,t:urlDecodeUni,deny,status:403,log,msg:'AllCallAll: path traversal',tag:'attack-lfi'"

# ---- OWASP A03: 命令注入（提示词/工具参数） ----
SecRule REQUEST_BODY|REQUEST_URI \
    "@rx (?:;|\||`)(?:cat|curl|wget|bash|sh|nc|python|perl)\s" \
    "id:10030,phase:2,t:none,t:urlDecodeUni,deny,status:403,log,msg:'AllCallAll: command injection',tag:'attack-rce'"

# ---- OWASP A10/A07: SSRF（图片/URL 抓取参数） ----
SecRule ARGS:post_payload|ARGS:image_url|ARGS:url|ARGS:webhook|ARGS:callback \
    "@rx (?:(?:169\.254\.169\.254)|(?:metadata\.google|metadata\.azure)|(?:127\.0\.0\.1)|(?:0\.0\.0\.0)|(?:localhost))" \
    "id:10040,phase:2,t:none,t:urlDecodeUni,deny,status:403,log,msg:'AllCallAll: SSRF attempt',tag:'attack-ssrf'"

# ---- AI 专项：提示注入（针对 agent/chat/knowledge 端点） ----
SecRule REQUEST_BODY \
    "@rx (?i)(ignore\s+previous\s+instructions|disregard\s+your\s+system\s+prompt|system\s*prompt\s*:|<system>)" \
    "id:10050,phase:2,t:none,t:lowercase,deny,status:403,log,msg:'AllCallAll: prompt injection attempt',tag:'ai-abuse',chain"
    SecRule REQUEST_URI "@rx /api/v1/(?:agent|chat|knowledge)"

# ---- AI 专项：批量爬取 RAG/检索端点（仅记录，配合限速） ----
SecRule REQUEST_URI "@rx ^/api/v1/(?:knowledge|search)" \
    "id:10060,phase:1,t:none,pass,log,auditlog,msg:'AllCallAll: RAG endpoint access (rate-limit candidate)',tag:'ai-abuse'"

# ---- 限速：单 IP 每分钟 600 请求（兜底，后端另有滑动窗口限速） ----
SecRule IP:DURATION "@eq 1" \
    "id:10070,phase:1,t:none,initcol:ip=%{REMOTE_ADDR},pass,nolog"
SecRule REQUEST_URI "@rx ^/api/" \
    "id:10071,phase:1,t:none,deny,status:429,log,msg:'AllCallAll: per-IP rate limit exceeded',tag:'rate-limit',chain"
    SecRule IP:RATE_LIMIT "@gt 600"
