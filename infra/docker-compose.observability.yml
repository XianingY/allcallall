# Optional observability stack for the self-hosted AllCallAll deployment.
#
# Bring it up together with the production stack so Prometheus can reach the
# backend over the shared `allcallall_network`:
#
#   docker compose -f infra/docker-compose.production.yml \
#                  -f infra/docker-compose.observability.yml up -d
#
# (Both files are parsed as one project, so they share the `allcallall_network`
# network. Prometheus runs inside that internal network, so it can scrape the
# backend /api/v1/metrics endpoint without the METRICS_BEARER_TOKEN.)
services:
  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - prometheus_data:/prometheus
    # No depends_on for alertmanager: it lives behind the `alerting` profile,
    # so it may not be running at all. Prometheus starts either way and only
    # logs that it cannot reach it.
    ports:
      - "9090:9090"
    networks:
      - allcallall_network
    restart: unless-stopped

  # Behind a profile because it is useless without a real notification
  # channel:  docker compose ... --profile alerting up -d
  #
  # Two separate failures had to be fixed here:
  #   1. The URLs once defaulted to http://localhost:9094/ - started fine,
  #      passed validation, delivered nothing.
  #   2. The config then used {{ env "VAR" }}, which Alertmanager does not
  #      support at all (it expands neither that nor ${VAR}), so the URL
  #      stayed a literal string and alerts were still not delivered.
  #
  # So the config is now a template rendered at start-up by
  # render-alertmanager.sh, which refuses to emit a file while any URL is
  # missing and checks that no placeholder survived. Alertmanager then reads
  # the rendered file.
  alertmanager:
    image: prom/alertmanager:v0.27.0
    profiles: ["alerting"]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        /etc/alertmanager/render-alertmanager.sh
        exec /bin/alertmanager \
          --config.file=/tmp/alertmanager.yml \
          --storage.path=/alertmanager
    environment:
      # No defaults on purpose - an unset value is what makes the render step
      # fail loudly instead of quietly sending alerts nowhere.
      ALERTMANAGER_WEBHOOK_URL: ${ALERTMANAGER_WEBHOOK_URL:-}
      ALERTMANAGER_WEBHOOK_URL_CRITICAL: ${ALERTMANAGER_WEBHOOK_URL_CRITICAL:-}
      ALERTMANAGER_WEBHOOK_URL_SECURITY: ${ALERTMANAGER_WEBHOOK_URL_SECURITY:-}
    volumes:
      - ./observability/alertmanager.tmpl:/etc/alertmanager/alertmanager.tmpl:ro
      - ./observability/render-alertmanager.sh:/etc/alertmanager/render-alertmanager.sh:ro
      - alertmanager_data:/alertmanager
    ports:
      - "9093:9093"
    networks:
      - allcallall_network
    restart: unless-stopped

  loki:
    image: grafana/loki:3.1.0
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ./observability/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"
    networks:
      - allcallall_network
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.1.0
    command: -config.file=/etc/promtail/promtail.yml
    volumes:
      - ./observability/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - allcallall_network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki
    networks:
      - allcallall_network
    restart: unless-stopped

networks:
  allcallall_network:
    name: allcallall_network

volumes:
  prometheus_data:
  alertmanager_data:
  loki_data:
  grafana_data:
