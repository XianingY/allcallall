server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https: wss:; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' https://www.gstatic.com https://js.stripe.com; worker-src 'self'; frame-src https://js.stripe.com https://*.stripe.com https://*.revenuecat.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; manifest-src 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    location ~ ^/api/v1/(ws|chat/ws)$ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        keepalive_timeout 3600s;
    }

    location /api/v1/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    location /api/v1/internal/support/ {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /config.js {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store" always;
        try_files /config.js =404;
    }

    location = /firebase-messaging-sw.js {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store" always;
        try_files /firebase-messaging-sw.js =404;
    }

    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store" always;
        try_files /index.html =404;
    }

    location /assets/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location ~ ^/rooms/([^/]+)/preflight$ {
        return 302 /meetings/$1/preflight;
    }

    location ~ ^/rooms/([^/]+)$ {
        return 302 /meetings/$1;
    }

    location = /agent-demo {
        return 302 /agent-lab;
    }

    location = /health {
        default_type text/plain;
        return 200 "OK";
    }

    location / {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ /index.html;
    }
}
