# Sentinel configuration shared by all 3 sentinel nodes.
# myid is auto-assigned; do not set it here so each container gets a unique id.
port 26379
dir /tmp
sentinel monitor allcallall-redis redis1 6379 2
sentinel auth-pass allcallall-redis ${REDIS_PASSWORD}
sentinel down-after-milliseconds allcallall-redis 5000
sentinel failover-timeout allcallall-redis 10000
sentinel parallel-syncs allcallall-redis 1
