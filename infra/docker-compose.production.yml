services:
  mysql:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: allcallall_db
      MYSQL_USER: allcallall
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    networks:
      - allcallall_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.2
    volumes:
      - redis_data:/data
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning", "--requirepass", "${REDIS_PASSWORD}"]
    restart: unless-stopped
    networks:
      - allcallall_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: ../backend
      dockerfile: Dockerfile
    entrypoint: ["/app/migrate"]
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      APP_ENV: production
      DB_DSN: allcallall:${MYSQL_PASSWORD}@tcp(mysql:3306)/allcallall_db?parseTime=true&charset=utf8mb4&loc=Local
      CONFIG_PATH: /app/configs/config.yaml
    volumes:
      - ../backend/configs:/app/configs:ro
    restart: "no"
    networks:
      - allcallall_network

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      APP_ENV: production
      DB_AUTO_MIGRATE: "0"
      DB_DSN: allcallall:${MYSQL_PASSWORD}@tcp(mysql:3306)/allcallall_db?parseTime=true&charset=utf8mb4&loc=Local
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      HTTP_PORT: "8080"
      CONFIG_PATH: /app/configs/config.yaml
      WEBRTC_ICE_SERVERS_JSON: '[{"urls":["stun:${TURN_HOST}:3478","turn:${TURN_HOST}:3478?transport=udp","turn:${TURN_HOST}:3478?transport=tcp","turns:${TURN_HOST}:5349?transport=tcp"],"username":"${TURN_USERNAME}","credential":"${TURN_PASSWORD}"}]'
      FCM_SERVICE_ACCOUNT_PATH: ${FCM_SERVICE_ACCOUNT_PATH:-}
      WS_PING_INTERVAL: ${WS_PING_INTERVAL:-30s}
      WS_PONG_WAIT: ${WS_PONG_WAIT:-60s}
      TRANSLATION_ENABLED: "${TRANSLATION_ENABLED:-false}"
      TRANSLATION_PROVIDER: "${TRANSLATION_PROVIDER:-volc_ast}"
      TRANSLATION_CHUNK_MS: "${TRANSLATION_CHUNK_MS:-400}"
      TRANSLATION_PARTIAL_DEBOUNCE_MS: "${TRANSLATION_PARTIAL_DEBOUNCE_MS:-600}"
      VOLC_AST_APP_KEY: "${VOLC_AST_APP_KEY}"
      VOLC_AST_ACCESS_KEY: "${VOLC_AST_ACCESS_KEY}"
      VOLC_AST_RESOURCE_ID: "${VOLC_AST_RESOURCE_ID:-volc.service_type.10053}"
      VOLC_AST_WS_URL: "${VOLC_AST_WS_URL:-wss://openspeech.bytedance.com/api/v4/ast/v2/translate}"
      ROOM_MAX_PARTICIPANTS: "${ROOM_MAX_PARTICIPANTS:-6}"
      RECORDING_STORAGE_DRIVER: "${RECORDING_STORAGE_DRIVER:-local}"
      RECORDING_STORAGE_DIR: /app/recordings
      RECORDING_S3_BUCKET: "${RECORDING_S3_BUCKET:-}"
      RECORDING_S3_REGION: "${RECORDING_S3_REGION:-}"
      RECORDING_S3_ENDPOINT: "${RECORDING_S3_ENDPOINT:-}"
      RECORDING_S3_ACCESS_KEY_ID: "${RECORDING_S3_ACCESS_KEY_ID:-}"
      RECORDING_S3_SECRET_ACCESS_KEY: "${RECORDING_S3_SECRET_ACCESS_KEY:-}"
      TRANSCRIPTION_ENABLED: "${TRANSCRIPTION_ENABLED:-true}"
      TRANSCRIPTION_PROVIDER: "${TRANSCRIPTION_PROVIDER:-openai_compatible}"
      TRANSCRIPTION_OPENAI_BASE_URL: "${TRANSCRIPTION_OPENAI_BASE_URL:-}"
      TRANSCRIPTION_OPENAI_API_KEY: "${TRANSCRIPTION_OPENAI_API_KEY:-}"
      TRANSCRIPTION_OPENAI_MODEL: "${TRANSCRIPTION_OPENAI_MODEL:-}"
      TRANSCRIPTION_OPENAI_LANGUAGE: "${TRANSCRIPTION_OPENAI_LANGUAGE:-}"
      TRANSCRIPTION_CHUNK_SECONDS: "${TRANSCRIPTION_CHUNK_SECONDS:-600}"
      TRANSCRIPTION_MAX_UPLOAD_BYTES: "${TRANSCRIPTION_MAX_UPLOAD_BYTES:-25165824}"
      AGENT_PROVIDER: "${AGENT_PROVIDER:-openai_compatible}"
      AGENT_PROVIDER_STRICT: "${AGENT_PROVIDER_STRICT:-true}"
      AGENT_OPENAI_BASE_URL: "${AGENT_OPENAI_BASE_URL:-}"
      AGENT_OPENAI_API_KEY: "${AGENT_OPENAI_API_KEY:-}"
      AGENT_OPENAI_MODEL: "${AGENT_OPENAI_MODEL:-}"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ../backend/configs:/app/configs:ro
      - recording_data:/app/recordings
    restart: unless-stopped
    networks:
      - allcallall_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/v1/ready"]
      interval: 30s
      timeout: 10s
      retries: 3

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
      args:
        EXPO_PUBLIC_API_HTTP: "${PUBLIC_API_HTTP:-https://localhost/api/v1}"
        EXPO_PUBLIC_API_WS: "${PUBLIC_API_WS:-wss://localhost/api/v1/ws}"
        EXPO_PUBLIC_FORCE_TLS: "1"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - allcallall_network

  coturn:
    image: coturn/coturn:4.6.3
    command:
      - -n
      - --log-file=stdout
      - --fingerprint
      - --lt-cred-mech
      - --realm=${TURN_REALM}
      - --user=${TURN_USERNAME}:${TURN_PASSWORD}
      - --listening-port=3478
      - --tls-listening-port=5349
      - --min-port=49152
      - --max-port=49200
      - --cert=/etc/coturn/ssl/fullchain.pem
      - --pkey=/etc/coturn/ssl/privkey.pem
    ports:
      - "3478:3478"
      - "3478:3478/udp"
      - "5349:5349"
      - "5349:5349/udp"
      - "49152-49200:49152-49200/udp"
    volumes:
      - ./ssl:/etc/coturn/ssl:ro
    restart: unless-stopped
    networks:
      - allcallall_network

volumes:
  mysql_data:
  redis_data:
  recording_data:

networks:
  allcallall_network:
    driver: bridge
