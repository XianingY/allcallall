global:
  scrape_interval: 30s
  evaluation_interval: 30s

# Alerting rules are evaluated by Prometheus and forwarded to Alertmanager.
# Keep the expressions in sync with the metrics the backend actually emits -
# see the comment at the top of alert.rules.yml.
rule_files:
  - /etc/prometheus/alert.rules.yml

# Without this block Prometheus evaluates rules and then drops the alerts on
# the floor: rules exist, nothing is ever delivered.
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: backend
    metrics_path: /api/v1/metrics
    # The backend /api/v1/metrics endpoint is restricted to internal networks by
    # default and may optionally require a METRICS_BEARER_TOKEN. Prometheus runs
    # inside the allcallall_network (internal), so no token is needed in the
    # default setup. If you enable the token, uncomment and set it:
    # authorization:
    #   type: Bearer
    #   credentials: "${METRICS_BEARER_TOKEN}"
    static_configs:
      - targets: ['backend:8080']

  # Standard Prometheus registry exposed by internal/metrics.Serve on its own
  # port. Separate from the self-rendered /api/v1/metrics above: this one
  # carries the HTTP request metrics and the Go runtime/process metrics.
  - job_name: backend-standard
    metrics_path: /metrics
    static_configs:
      - targets: ['backend:9090']

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
