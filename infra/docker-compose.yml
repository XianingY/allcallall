services:
  mysql:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: allcallall_db
      MYSQL_USER: allcallall
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    networks:
      - allcallall_network

  redis:
    image: redis:7.2
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning", "--requirepass", "${REDIS_PASSWORD}"]
    restart: unless-stopped
    networks:
      - allcallall_network

  kafka:
    profiles: ["interview-infra", "kafka"]
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.8
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 512M
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://kafka:9092
    ports:
      - "9092:9092"
    networks:
      - allcallall_network

  elasticsearch:
    profiles: ["interview-infra", "search"]
    build:
      context: ./elasticsearch
      args:
        ELASTICSEARCH_VERSION: "8.19.10"
    image: ${ELASTICSEARCH_IMAGE:-allcallall-elasticsearch-ik:8.19.10}
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - allcallall_network

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    depends_on:
      - mysql
      - redis
    environment:
      DB_DSN: allcallall:${MYSQL_PASSWORD}@tcp(mysql:3306)/allcallall_db?parseTime=true&charset=utf8mb4&loc=Local
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      HTTP_PORT: "8080"
      CONFIG_PATH: /app/configs/config.yaml
      WEBRTC_ICE_SERVERS_JSON: '${WEBRTC_ICE_SERVERS_JSON:-[{"urls":["stun:stun.l.google.com:19302"]}]}'
      # FCM 推送通知（可选，配置后将启用真实发送）
      FCM_SERVICE_ACCOUNT_PATH: ${FCM_SERVICE_ACCOUNT_PATH:-}
      # WebSocket keepalive 配置
      WS_PING_INTERVAL: ${WS_PING_INTERVAL:-30s}
      WS_PONG_WAIT: ${WS_PONG_WAIT:-60s}
      AGENT_RUNTIME: ${AGENT_RUNTIME:-python_langgraph}
      PY_AGENT_RUNTIME_BASE_URL: ${PY_AGENT_RUNTIME_BASE_URL:-http://agent-runtime:8090}
      PY_RAG_RUNTIME_BASE_URL: ${PY_RAG_RUNTIME_BASE_URL:-http://rag-runtime:8091}
      PY_AGENT_RUNTIME_TIMEOUT_SEC: ${PY_AGENT_RUNTIME_TIMEOUT_SEC:-60}
      PY_AGENT_RUNTIME_STRICT: ${PY_AGENT_RUNTIME_STRICT:-true}
      AGENT_RUNTIME_TOOL_TOKEN: ${AGENT_RUNTIME_TOOL_TOKEN:-local-agent-runtime-tool-token}
      MCP_PLATFORM_ENABLED: ${MCP_PLATFORM_ENABLED:-true}
      SANDBOX_EXECUTION_ENABLED: ${SANDBOX_EXECUTION_ENABLED:-true}
      SANDBOX_CONTROL_PLANE_URL: ${SANDBOX_CONTROL_PLANE_URL:-http://sandbox-control-plane:8092}
      OPENBAO_ADDR: ${OPENBAO_ADDR:-http://openbao:8200}
      OPENBAO_TOKEN: ${OPENBAO_TOKEN:-}
      MCP_CAPABILITY_ED25519_PRIVATE_KEY: ${MCP_CAPABILITY_ED25519_PRIVATE_KEY:-}
      SANDBOX_CAPABILITY_ED25519_PUBLIC_KEY: ${SANDBOX_CAPABILITY_ED25519_PUBLIC_KEY:-}
    ports:
      - "8080:8080"
    volumes:
      - ../backend/configs:/app/configs:ro
    restart: unless-stopped
    networks:
      - allcallall_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  agent-runtime:
    build:
      context: ..
      dockerfile: agent-runtime/Dockerfile
    image: ${PY_AGENT_RUNTIME_IMAGE:-allcallall-agent-runtime:local}
    environment:
      PY_AGENT_PROVIDER: ${PY_AGENT_PROVIDER:-rules}
      PY_AGENT_OPENAI_BASE_URL: ${PY_AGENT_OPENAI_BASE_URL:-}
      PY_AGENT_OPENAI_API_KEY: ${PY_AGENT_OPENAI_API_KEY:-}
      PY_AGENT_OPENAI_MODEL: ${PY_AGENT_OPENAI_MODEL:-}
      PY_AGENT_TOOL_BRIDGE_BASE_URL: ${PY_AGENT_TOOL_BRIDGE_BASE_URL:-http://backend:8080}
      PY_AGENT_TOOL_BRIDGE_TOKEN: ${AGENT_RUNTIME_TOOL_TOKEN:-local-agent-runtime-tool-token}
      PY_RAG_RUNTIME_BASE_URL: ${PY_RAG_RUNTIME_BASE_URL:-http://rag-runtime:8091}
      PY_AGENT_HARNESS: ${PY_AGENT_HARNESS:-allcallall_v1}
      PY_AGENT_LOOP_MAX_STEPS: ${PY_AGENT_LOOP_MAX_STEPS:-5}
      PY_AGENT_ENABLE_CRITIC: ${PY_AGENT_ENABLE_CRITIC:-true}
      PY_AGENT_RUNTIME_PORT: "8090"
      PY_AGENT_CHECKPOINT_MYSQL_ENABLED: ${LANGGRAPH_MYSQL_CHECKPOINT_ENABLED:-true}
      PY_AGENT_CHECKPOINT_MYSQL_DSN: mysql://allcallall:${MYSQL_PASSWORD}@mysql:3306/allcallall_db
    ports:
      - "8090:8090"
    restart: unless-stopped
    networks:
      - allcallall_network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health', timeout=2)"]
      interval: 30s
      timeout: 10s
      retries: 3

  openbao:
    image: openbao/openbao:2.2.0
    cap_add:
      - IPC_LOCK
    environment:
      BAO_DEV_ROOT_TOKEN_ID: ${OPENBAO_TOKEN:-}
      BAO_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    command: server -dev
    networks:
      - allcallall_network
    healthcheck:
      test: ["CMD", "bao", "status"]
      interval: 10s
      timeout: 5s
      retries: 10

  sandbox-runner:
    build:
      context: ../sandbox-runner
      dockerfile: Dockerfile
    environment:
      OPENBAO_ADDR: http://openbao:8200
      SANDBOX_ALLOW_STDIO: "0"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /run/secrets:size=1m,mode=0700
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 512m
    cpus: 0.5
    networks:
      - allcallall_network

  sandbox-control-plane:
    build:
      context: ../backend
      dockerfile: Dockerfile.sandbox
    depends_on:
      - mysql
      - sandbox-runner
      - openbao
    environment:
      SANDBOX_ADDR: :8092
      SANDBOX_RUNNER_URL: http://sandbox-runner:8093
      SANDBOX_DB_DSN: allcallall:${MYSQL_PASSWORD}@tcp(mysql:3306)/allcallall_db?parseTime=true&charset=utf8mb4&loc=UTC
      SANDBOX_CAPABILITY_ED25519_PUBLIC_KEY: ${SANDBOX_CAPABILITY_ED25519_PUBLIC_KEY:-}
      TRIVY_CACHE_DIR: /tmp/trivy-cache
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 768m
    cpus: 1.0
    networks:
      - allcallall_network

  rag-runtime:
    build:
      context: ..
      dockerfile: rag-runtime/Dockerfile
    image: ${PY_RAG_RUNTIME_IMAGE:-allcallall-rag-runtime:local}
    environment:
      PY_RAG_RERANK_PROVIDER: ${PY_RAG_RERANK_PROVIDER:-rules}
      PY_RAG_TOOL_BRIDGE_BASE_URL: ${PY_RAG_TOOL_BRIDGE_BASE_URL:-http://backend:8080}
      PY_RAG_TOOL_BRIDGE_TOKEN: ${AGENT_RUNTIME_TOOL_TOKEN:-local-agent-runtime-tool-token}
      PY_RAG_TOP_K: ${PY_RAG_TOP_K:-8}
      PY_RAG_MAX_STEPS: ${PY_RAG_MAX_STEPS:-3}
      PY_RAG_MIN_CONFIDENCE: ${PY_RAG_MIN_CONFIDENCE:-0.6}
      PY_RAG_VECTOR_STORE: ${PY_RAG_VECTOR_STORE:-none}
      PY_RAG_QDRANT_URL: ${PY_RAG_QDRANT_URL:-}
      PY_RAG_QDRANT_COLLECTION: ${PY_RAG_QDRANT_COLLECTION:-allcallall_context_chunks}
      PY_RAG_RUNTIME_PORT: "8091"
    ports:
      - "8091:8091"
    restart: unless-stopped
    networks:
      - allcallall_network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8091/health', timeout=2)"]
      interval: 30s
      timeout: 10s
      retries: 3

  api:
    profiles: ["microservices", "api"]
    build:
      context: ../backend
      dockerfile: Dockerfile
    depends_on:
      - mysql
      - redis
    environment:
      DB_DSN: allcallall:${MYSQL_PASSWORD}@tcp(mysql:3306)/allcallall_db?parseTime=true&charset=utf8mb4&loc=Local
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      HTTP_PORT: "8080"
      CONFIG_PATH: /app/configs/config.yaml
      EMBEDDED_WORKERS: "0"
      AGENT_PROVIDER: ${AGENT_PROVIDER:-rules}
      USER_SERVICE_GRPC_ADDR: ${USER_SERVICE_GRPC_ADDR:-user-service:9090}
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:9092}
      KAFKA_SETTLEMENT_TOPIC: ${KAFKA_SETTLEMENT_TOPIC:-allcallall.room.settlements}
      ELASTICSEARCH_URL: ${ELASTICSEARCH_URL:-http://elasticsearch:9200}
      ELASTICSEARCH_INDEX: ${ELASTICSEARCH_INDEX:-allcallall_messages}
      WEBRTC_ICE_SERVERS_JSON: '${WEBRTC_ICE_SERVERS_JSON:-[{"urls":["stun:stun.l.google.com:19302"]}]}'
      FCM_SERVICE_ACCOUNT_PATH: ${FCM_SERVICE_ACCOUNT_PATH:-}
      WS_PING_INTERVAL: ${WS_PING_INTERVAL:-30s}
      WS_PONG_WAIT: ${WS_PONG_WAIT:-60s}
      AGENT_RUNTIME: ${AGENT_RUNTIME:-python_langgraph}
      PY_AGENT_RUNTIME_BASE_URL: ${PY_AGENT_RUNTIME_BASE_URL:-http://agent-runtime:8090}
      PY_RAG_RUNTIME_BASE_URL: ${PY_RAG_RUNTIME_BASE_URL:-http://rag-runtime:8091}
      PY_AGENT_RUNTIME_TIMEOUT_SEC: ${PY_AGENT_RUNTIME_TIMEOUT_SEC:-60}
      PY_AGENT_RUNTIME_STRICT: ${PY_AGENT_RUNTIME_STRICT:-true}
      AGENT_RUNTIME_TOOL_TOKEN: ${AGENT_RUNTIME_TOOL_TOKEN:-local-agent-runtime-tool-token}
    ports:
      - "8080:8080"
    volumes:
      - ../backend/configs:/app/configs:ro
    restart: unless-stopped
    command: ["/app/server"]
    networks:
      - allcallall_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  user-service:
    profiles: ["microservices", "user-service"]
    build:
      context: ../backend
      dockerfile: Dockerfile
    depends_on:
      - mysql
    environment:
      DB_DSN: allcallall:${MYSQL_PASSWORD}@tcp(mysql:3306)/allcallall_db?parseTime=true&charset=utf8mb4&loc=Local
      JWT_SECRET: ${JWT_SECRET}
      CONFIG_PATH: /app/configs/config.yaml
      USER_GRPC_ADDR: :9090
    volumes:
      - ../backend/configs:/app/configs:ro
    restart: unless-stopped
    command: ["/app/user-service"]
    networks:
      - allcallall_network

  data-worker:
    profiles: ["microservices", "data-worker"]
    build:
      context: ../backend
      dockerfile: Dockerfile
    depends_on:
      - mysql
      - kafka
    environment:
      DB_DSN: allcallall:${MYSQL_PASSWORD}@tcp(mysql:3306)/allcallall_db?parseTime=true&charset=utf8mb4&loc=Local
      CONFIG_PATH: /app/configs/config.yaml
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:9092}
      KAFKA_SETTLEMENT_TOPIC: ${KAFKA_SETTLEMENT_TOPIC:-allcallall.room.settlements}
      KAFKA_CONSUMER_GROUP: ${KAFKA_CONSUMER_GROUP:-allcallall-data-worker}
    volumes:
      - ../backend/configs:/app/configs:ro
    restart: unless-stopped
    command: ["/app/data-worker"]
    networks:
      - allcallall_network

  search-worker:
    profiles: ["microservices", "search-worker"]
    build:
      context: ../backend
      dockerfile: Dockerfile
    depends_on:
      - mysql
      - elasticsearch
    environment:
      DB_DSN: allcallall:${MYSQL_PASSWORD}@tcp(mysql:3306)/allcallall_db?parseTime=true&charset=utf8mb4&loc=Local
      CONFIG_PATH: /app/configs/config.yaml
      ELASTICSEARCH_URL: ${ELASTICSEARCH_URL:-http://elasticsearch:9200}
      ELASTICSEARCH_INDEX: ${ELASTICSEARCH_INDEX:-allcallall_messages}
      WORKER_ID: search-worker
      OUTBOX_WORKER_INTERVAL_SEC: ${OUTBOX_WORKER_INTERVAL_SEC:-1}
      OUTBOX_WORKER_BATCH_SIZE: ${OUTBOX_WORKER_BATCH_SIZE:-50}
    volumes:
      - ../backend/configs:/app/configs:ro
    restart: unless-stopped
    command: ["/app/search-worker"]
    networks:
      - allcallall_network

  agent-worker:
    profiles: ["microservices", "agent-worker"]
    build:
      context: ../backend
      dockerfile: Dockerfile
    depends_on:
      - mysql
      - redis
    environment:
      DB_DSN: allcallall:${MYSQL_PASSWORD}@tcp(mysql:3306)/allcallall_db?parseTime=true&charset=utf8mb4&loc=Local
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      CONFIG_PATH: /app/configs/config.yaml
      AGENT_PROVIDER: ${AGENT_PROVIDER:-rules}
      AGENT_RUNTIME: ${AGENT_RUNTIME:-python_langgraph}
      PY_AGENT_RUNTIME_BASE_URL: ${PY_AGENT_RUNTIME_BASE_URL:-http://agent-runtime:8090}
      PY_RAG_RUNTIME_BASE_URL: ${PY_RAG_RUNTIME_BASE_URL:-http://rag-runtime:8091}
      PY_AGENT_RUNTIME_TIMEOUT_SEC: ${PY_AGENT_RUNTIME_TIMEOUT_SEC:-60}
      PY_AGENT_RUNTIME_STRICT: ${PY_AGENT_RUNTIME_STRICT:-true}
      AGENT_RUNTIME_TOOL_TOKEN: ${AGENT_RUNTIME_TOOL_TOKEN:-local-agent-runtime-tool-token}
      MCP_PLATFORM_ENABLED: ${MCP_PLATFORM_ENABLED:-true}
      SANDBOX_EXECUTION_ENABLED: ${SANDBOX_EXECUTION_ENABLED:-true}
      SANDBOX_CONTROL_PLANE_URL: ${SANDBOX_CONTROL_PLANE_URL:-http://sandbox-control-plane:8092}
      OPENBAO_ADDR: ${OPENBAO_ADDR:-http://openbao:8200}
      OPENBAO_TOKEN: ${OPENBAO_TOKEN:-}
      MCP_CAPABILITY_ED25519_PRIVATE_KEY: ${MCP_CAPABILITY_ED25519_PRIVATE_KEY:-}
      SANDBOX_CAPABILITY_ED25519_PUBLIC_KEY: ${SANDBOX_CAPABILITY_ED25519_PUBLIC_KEY:-}
      WORKER_ID: agent-worker
      OUTBOX_WORKER_INTERVAL_SEC: ${OUTBOX_WORKER_INTERVAL_SEC:-1}
      OUTBOX_WORKER_BATCH_SIZE: ${OUTBOX_WORKER_BATCH_SIZE:-50}
    volumes:
      - ../backend/configs:/app/configs:ro
    restart: unless-stopped
    command: ["/app/agent-worker"]
    networks:
      - allcallall_network

  outbox-worker:
    profiles: ["microservices", "outbox-worker"]
    build:
      context: ../backend
      dockerfile: Dockerfile
    depends_on:
      - mysql
      - redis
    environment:
      DB_DSN: allcallall:${MYSQL_PASSWORD}@tcp(mysql:3306)/allcallall_db?parseTime=true&charset=utf8mb4&loc=Local
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      CONFIG_PATH: /app/configs/config.yaml
      WORKER_ID: outbox-worker
      OUTBOX_WORKER_INTERVAL_SEC: ${OUTBOX_WORKER_INTERVAL_SEC:-1}
      OUTBOX_WORKER_BATCH_SIZE: ${OUTBOX_WORKER_BATCH_SIZE:-50}
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:9092}
      KAFKA_SETTLEMENT_TOPIC: ${KAFKA_SETTLEMENT_TOPIC:-allcallall.room.settlements}
    volumes:
      - ../backend/configs:/app/configs:ro
    restart: unless-stopped
    command: ["/app/outbox-worker"]
    networks:
      - allcallall_network

  cleanup-worker:
    profiles: ["microservices", "cleanup-worker"]
    build:
      context: ../backend
      dockerfile: Dockerfile
    depends_on:
      - mysql
      - redis
    environment:
      DB_DSN: allcallall:${MYSQL_PASSWORD}@tcp(mysql:3306)/allcallall_db?parseTime=true&charset=utf8mb4&loc=Local
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      CONFIG_PATH: /app/configs/config.yaml
      WORKER_ID: cleanup-worker
      REFRESH_SESSION_CLEANUP_INTERVAL_MIN: ${REFRESH_SESSION_CLEANUP_INTERVAL_MIN:-1440}
      RECORDING_CLEANUP_INTERVAL_MIN: ${RECORDING_CLEANUP_INTERVAL_MIN:-60}
      RECORDING_STORAGE_DRIVER: ${RECORDING_STORAGE_DRIVER:-local}
      RECORDING_STORAGE_DIR: ${RECORDING_STORAGE_DIR:-/tmp/allcallall-recordings}
    volumes:
      - ../backend/configs:/app/configs:ro
      - recording_data:/tmp/allcallall-recordings
    restart: unless-stopped
    command: ["/app/cleanup-worker"]
    networks:
      - allcallall_network

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
        #      - ./ssl:/etc/nginx/ssl:ro
        #      - ./html:/usr/share/nginx/html
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - allcallall_network

volumes:
  mysql_data:
  redis_data:
  recording_data:
  es_data:

networks:
  allcallall_network:
    driver: bridge
