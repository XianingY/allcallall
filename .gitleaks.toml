# AllCallAll secret-scanning configuration.
# Used by `gitleaks` both in the local pre-commit hook (scripts/secret-scan.sh)
# and in CI (.github/workflows/security.yml, job "gitleaks"). Note the job lives
# in security.yml - there is no separate secret-scan.yml, that split was
# abandoned and merged into security.yml.
#
# Extends gitleaks' built-in default rule set, then allowlists files that
# intentionally contain only placeholders (never real credentials).

title = "AllCallAll gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Template/example files contain only placeholders, never real credentials."
regexTarget = "match"
regexes = [
  # Dummy JWT secrets in Go unit tests. auth.NewManager enforces a 32-byte
  # minimum, so test literals must be long enough to trip the generic-api-key
  # entropy heuristic; they are fixed, clearly test-prefixed, and never
  # credentials. Real secrets pasted into tests will not match this shape.
  '''test-(jwt|top|grpc)-secret-[a-z0-9-]+''',
  # Kubernetes Secret *key name*, not the credential value. The private key
  # itself remains external to the chart and is injected via secretKeyRef.
  '''mcp-capability-ed25519-private-key''',
]
paths = [
  '''(?i)\.example\.env$''',
  '''(?i)\.env\.example$''',
  '''(?i)\.env\.template$''',
  '''(?i)\.example\.(ya?ml|json|toml)$''',
  '''(?i)\.xcode\.env$''',
  '''(?i)/testdata/''',
]
