server:
  host: "0.0.0.0"
  port: 8080
  read_timeout_seconds: 10
  write_timeout_seconds: 15
  idle_timeout_seconds: 60

database:
  # 使用环境变量
  dsn: "allcallall:${MYSQL_PASSWORD}@tcp(mysql:3306)/allcallall_db?parseTime=true&charset=utf8mb4&loc=Local"
  max_open_conns: 50
  max_idle_conns: 10
  conn_max_lifetime_minutes: 30

redis:
  addr: "redis:6379"
  username: ""
  # ${VAR:-default} 表示可缺省：无密码的 Redis 是合法部署形态。
  # 写成 ${VAR}（无默认值）则表示必需，缺失时服务拒绝启动。
  password: "${REDIS_PASSWORD:-}"
  db: 0

mail:
  host: "smtp.qq.com"
  port: 587
  username: "1569297330@qq.com"  # QQ邮箱SMTP登录必须使用完整邮箱地址
  # 邮件功能未启用时可缺省。
  password: "${MAIL_PASSWORD:-}"
  from: "1569297330@qq.com"
  from_name: "AllCallAll"
  max_retries: 3
  retry_delay_seconds: 5

jwt:
  secret: "${JWT_SECRET}"
  issuer: "allcallall-backend"
  # 访问令牌有效期。此前为 10080 分钟（7 天），与刷新令牌同为 7 天，
  # 刷新机制因此形同虚设——令牌被盗后有整整一周的可用窗口，且无法通过
  # 轮换缩短。改为 30 分钟后，客户端必须走刷新链路，这也是 web 端并发刷新
  # 去重与 mobile 端 401 自动刷新拦截器存在的前提。
  # 调优时注意：任何没有自动刷新的客户端都会在这个时长后被登出。
  access_token_ttl_minutes: 30
  # 刷新令牌有效期（7 天），与访问令牌拉开量级才有轮换意义。
  refresh_token_ttl_hours: 168

webrtc:
  ice_servers:
    - urls:
        - "stun:stun.l.google.com:19302"
        - "stun:stun1.l.google.com:19302"

translation:
  enabled: false
  provider: "volc_ast"
  chunk_ms: 400
  partial_debounce_ms: 600
  max_sessions_per_user: 2
  volc_ast:
    ws_url: "wss://openspeech.bytedance.com/api/v4/ast/v2/translate"
    # translation.enabled=false 时不会用到这些凭据，因此全部设为可缺省。
    app_key: "${VOLC_AST_APP_KEY:-}"
    access_key: "${VOLC_AST_ACCESS_KEY:-}"
    resource_id: "${VOLC_AST_RESOURCE_ID:-}"
    app_id: "${VOLC_AST_APP_ID:-}"

logging:
  level: "info"

# 周期性（weekly）任务调度器
# 生产环境默认关闭，通过环境变量 TASK_SCHEDULER_ENABLED=true 开启
task_scheduler:
  enabled: false
  interval_seconds: 60
  timezone: "UTC"
  max_concurrent: 8
  lease_seconds: 120
  default_max_failures: 5
