# Linting for the Go backend.
#
# CI ran only `go build` and `go vet`, so whole classes of defect that vet does
# not cover had no automated check at all.
#
# The enabled set is deliberately narrow and starts from what the code already
# satisfies, so turning this on is a hard gate from day one rather than a
# backlog people learn to ignore. Widen it as the remaining findings are
# cleared - the "not yet enabled" list below is the queue, roughly in the order
# they are worth fixing.
version: "2"

linters:
  default: none
  enable:
    # Equivalent to the `go vet` the CI already ran, kept here so a single tool
    # reports everything and the thresholds live in one file.
    - govet
    # Assignments whose value is never read - usually a real bug (a result
    # computed and dropped), and the codebase is already clean of them.
    - ineffassign
    # Unchecked errors. Deferred resource cleanup is explicit about ignoring
    # close failures; meaningful errors are propagated or logged.
    - errcheck
    # Broad correctness and simplification checks, including deprecated APIs.
    - staticcheck
    # Dead unexported code; production and test code both stay lean.
    - unused
    # Leaked HTTP response bodies; websocket handshake responses are exempt
    # where the library owns the body.
    - bodyclose
    # Security-oriented checks. Justified false positives carry inline #nosec
    # annotations with the reason; test setup noise is excluded below.
    - gosec
    # Wrapped-error correctness; sentinel and typed errors are matched with
    # errors.Is/As and wrapping preserves the full chain.
    - errorlint

  settings:
    govet:
      # Field alignment and shadow reports are noisy here and neither is a
      # correctness problem at this stage.
      disable:
        - fieldalignment
        - shadow

  exclusions:
    rules:
      # Tests legitimately ignore some errors and use long setup helpers.
      - path: _test\.go
        linters:
          - ineffassign
          - errcheck
          - gosec
      # Generated protobuf code is not ours to lint.
      - path: \.pb\.go
        linters:
          - govet
          - ineffassign
          - errcheck
          - staticcheck
          - unused

formatters:
  enable:
    - gofmt
  exclusions:
    paths:
      - \.pb\.go
