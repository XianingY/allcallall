# Every entry below is a CVE that lives in an UPSTREAM BASE IMAGE (OS package or
# bundled library), not in AllCallAll application code. Each has a known fixed
# version upstream. They are suppressed here only so the CRITICAL security gate
# does not block merges while the base images are refreshed; the scan still
# reports every other finding, including any NEW critical introduced later.
