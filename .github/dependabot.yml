# Dependabot configuration.
#
# House rule: at most a couple of PRs per ecosystem at any time. Dependabot's
# default is one PR per dependency, which on this repo meant 46 open PRs and
# 46 stale branches at once - noise that buries the two or three updates that
# actually matter and makes the branch list unreadable.
#
# Two levers produce that:
#   groups                  - collapse everything of the same kind into one PR
#   open-pull-requests-limit - hard cap on top of the grouping
#
# Per directory still means per directory: npm resolves each workspace
# separately, and a dependency can only be updated from the workspace that
# declares it.
version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 4
    groups:
      go-minor-and-patch:
        update-types: ["minor", "patch"]
      # Go modules bump major rarely and deliberately. One PR for all of them,
      # so an ecosystem bump never arrives as a dozen unrelated diffs.
      go-major:
        update-types: ["major"]
    target-branch: "main"

  # ---------------------------------------------------------------------
  # npm ecosystems are deliberately absent.
  #
  # Dependabot cannot produce a usable npm PR for this repository. On
  # 2026-10-11 it opened grouped PRs for /web, /mobile and / (electron) and
  # every one of them changed package.json **without touching
  # package-lock.json**. `npm ci` then refuses to install, and the failure is
  # identical across every job that installs: Web, Mobile, Desktop and OpenAPI
  # Contract Drift all went red together on all three PRs. The commits were
  # unmergeable by construction - not flaky, just wrong.
  #
  # The cause is the same one documented in the repo's memory file: this
  # lockfile is a monorepo-wide artifact carrying platform-specific optional
  # dependencies (the rolldown native binding, ajv's draft-04 schema, the
  # @esbuild/* set). Regenerating it drops entries for other platforms, which is
  # npm bug cli/4828. Any tool that rewrites the lock from a partial view of
  # the workspace produces a lock that fails on Linux.
  #
  # So npm dependencies are updated deliberately and locally:
  #
  #   npm install -w <workspace> <pkg>@<version>
  #   npm ci --dry-run                 # local sanity check
  #   # and the check that actually matters - simulate the container:
  #   mkdir -p /tmp/v/web && cp package.json package-lock.json /tmp/v/ \
  #     && cp -r patches /tmp/v/ && cp web/package.json /tmp/v/web/ \
  #     && (cd /tmp/v && npm ci --workspace=web --dry-run)
  #
  # and version bumps are verified with `npm run audit:ci --registry=https://registry.npmjs.org`
  # (the default mirror does not implement the audit API). gomod, docker and
  # github-actions below still work normally and stay enabled - the two base
  # image groups and the actions group merged cleanly on 2026-10-11.
  # ---------------------------------------------------------------------

  # Bundle every GitHub Action bump into ONE PR instead of one-per-action
  # (setup-go/setup-node/setup-python/upload-artifact were each opening their
  # own PR).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns:
          - "*"
    target-branch: "main"

  # Dependabot's docker ecosystem does not discover Dockerfiles below the
  # configured directory, so each directory that carries one gets its own
  # entry. The FROM lines pin base images by digest; these entries keep the
  # pins moving onto freshly patched base images. All three share a group name
  # so golang-alpine and node-slim arrive as one reviewable PR.
  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    groups:
      base-images:
        patterns:
          - "*"
    target-branch: "main"

  - package-ecosystem: "docker"
    directory: "/infra"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    groups:
      base-images:
        patterns:
          - "*"
    target-branch: "main"

  - package-ecosystem: "docker"
    directory: "/infra/elasticsearch"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    groups:
      base-images:
        patterns:
          - "*"
    target-branch: "main"
