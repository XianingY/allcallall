version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    target-branch: "main"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    target-branch: "main"

  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    target-branch: "main"

  - package-ecosystem: "npm"
    directory: "/mobile"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    target-branch: "main"

  - package-ecosystem: "npm"
    directory: "/desktop"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    target-branch: "main"

  # Bundle every GitHub Action bump into ONE PR instead of one-per-action
  # (setup-go/setup-node/setup-python/upload-artifact were each opening their
  # own PR). The 5-cap is a safety net; the group keeps it at ~1.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"
    target-branch: "main"

  # Dependabot's docker ecosystem does not discover Dockerfiles below the
  # configured directory, so each directory that carries one gets its own
  # entry. The FROM lines pin base images by digest; these entries keep the
  # pins moving onto freshly patched base images.
  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    target-branch: "main"

  - package-ecosystem: "docker"
    directory: "/infra"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    target-branch: "main"

  - package-ecosystem: "docker"
    directory: "/infra/elasticsearch"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    target-branch: "main"
