# Dependabot configuration.
#
# House rule: at most a couple of PRs per ecosystem at any time. Dependabot's
# default is one PR per dependency, which on this repo meant 46 open PRs and
# 46 stale branches at once - noise that buries the two or three updates that
# actually matter and makes the branch list unreadable.
#
# Two levers produce that:
#   groups                  - collapse everything of the same kind into one PR
#   open-pull-requests-limit - hard cap on top of the grouping
#
# Per directory still means per directory: npm resolves each workspace
# separately, and a dependency can only be updated from the workspace that
# declares it.
version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 4
    groups:
      go-minor-and-patch:
        update-types: ["minor", "patch"]
      # Go modules bump major rarely and deliberately. One PR for all of them,
      # so an ecosystem bump never arrives as a dozen unrelated diffs.
      go-major:
        update-types: ["major"]
    target-branch: "main"

  # Root manifest: dev tooling shared by every workspace (vite, vitest,
  # typescript-eslint, jsdom, msw).
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 4
    groups:
      npm-root-minor-and-patch:
        update-types: ["minor", "patch"]
      npm-root-major:
        update-types: ["major"]
    target-branch: "main"

  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 4
    groups:
      npm-web-minor-and-patch:
        update-types: ["minor", "patch"]
      # Radix, lucide, tanstack-table and friends have shipped breaking
      # changes this year. Keep majors in their own PR so a library migration
      # is never buried inside a patch bundle.
      npm-web-major:
        update-types: ["major"]
    target-branch: "main"

  # mobile is the noisiest ecosystem: Expo 57 pins the React Native and
  # react-native-webviews versions it supports, so bumping one without the
  # others produces a PR that cannot pass CI. Grouping does not fix that -
  # it just makes the set small enough to read before deciding.
  - package-ecosystem: "npm"
    directory: "/mobile"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      npm-mobile-minor-and-patch:
        update-types: ["minor", "patch"]
      npm-mobile-major:
        update-types: ["major"]
        exclude-patterns:
          # Expo's major bumps drag react-native and every expo-* package with
          # them; that is one deliberate piece of work, not a weekly PR.
          - "expo"
          - "react-native"
    target-branch: "main"

  - package-ecosystem: "npm"
    directory: "/desktop"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    groups:
      npm-desktop:
        patterns:
          - "*"
    target-branch: "main"

  # Bundle every GitHub Action bump into ONE PR instead of one-per-action
  # (setup-go/setup-node/setup-python/upload-artifact were each opening their
  # own PR).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns:
          - "*"
    target-branch: "main"

  # Dependabot's docker ecosystem does not discover Dockerfiles below the
  # configured directory, so each directory that carries one gets its own
  # entry. The FROM lines pin base images by digest; these entries keep the
  # pins moving onto freshly patched base images. All three share a group name
  # so golang-alpine and node-slim arrive as one reviewable PR.
  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    groups:
      base-images:
        patterns:
          - "*"
    target-branch: "main"

  - package-ecosystem: "docker"
    directory: "/infra"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    groups:
      base-images:
        patterns:
          - "*"
    target-branch: "main"

  - package-ecosystem: "docker"
    directory: "/infra/elasticsearch"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    groups:
      base-images:
        patterns:
          - "*"
    target-branch: "main"
