name: Documentation issue
description: Report missing, inaccurate, or confusing documentation.
title: "[Docs]: "
labels:
  - documentation
body:
  - type: input
    id: location
    attributes:
      label: Document location
      description: Provide the file path or page URL.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is unclear or incorrect?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested improvement
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I checked the maintained documentation index for a newer page.
          required: true
