name: Agent Platform CI

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: platform-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-runtimes:
    name: Python (${{ matrix.runtime }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [agent-runtime, rag-runtime, sandbox-runner]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            shared/pyproject.toml
            ${{ matrix.runtime }}/pyproject.toml
      - name: Install runtime and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "./shared[dev]"
          python -m pip install -e "./${{ matrix.runtime }}[dev]"
      - name: Unit tests
        working-directory: ${{ matrix.runtime }}
        run: python -m pytest -q
      - name: Ruff
        working-directory: ${{ matrix.runtime }}
        run: python -m ruff check .
      - name: Mypy
        working-directory: ${{ matrix.runtime }}
        run: python -m mypy .

  sandbox-go:
    name: Sandbox Control Plane (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.24.x"
          cache-dependency-path: backend/go.sum
      - name: Test sandbox packages
        working-directory: backend
        run: go test -race ./internal/sandbox/... ./cmd/sandbox-service
      - name: Static analysis
        working-directory: backend
        run: go vet ./internal/sandbox/... ./cmd/sandbox-service

  openapi-drift:
    name: OpenAPI Contract Drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install workspace dependencies
        run: npm ci
      - name: Regenerate API types
        working-directory: web
        run: npm run generate:api
      - name: Verify generated contract is committed
        run: git diff --exit-code -- packages/api-types/schema.d.ts
      - name: Verify handwritten clients use the shared contract
        working-directory: web
        run: npm run contract:check

  helm:
    name: Helm and Kubernetes Schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5.0.1
        with:
          version: v3.17.3
      - name: Lint chart
        run: |
          helm lint infra/helm/allcallall
          helm lint infra/helm/allcallall \
            -f infra/helm/allcallall/values-production.example.yaml
      - name: Render default and production charts
        run: |
          helm template allcallall infra/helm/allcallall --namespace allcallall > /tmp/allcallall.yaml
          helm template allcallall infra/helm/allcallall \
            --namespace allcallall \
            -f infra/helm/allcallall/values-production.example.yaml \
            > /tmp/allcallall-production.yaml
      - name: Validate Kubernetes resources
        run: |
          docker run --rm -i ghcr.io/yannh/kubeconform:v0.8.0 \
            -strict -summary -ignore-missing-schemas \
            < /tmp/allcallall.yaml
          docker run --rm -i ghcr.io/yannh/kubeconform:v0.8.0 \
            -strict -summary -ignore-missing-schemas \
            < /tmp/allcallall-production.yaml
      - name: Assert sandbox isolation controls
        run: |
          python -m pip install --quiet PyYAML==6.0.3
          python - <<'PY'
          import yaml

          with open("/tmp/allcallall.yaml", encoding="utf-8") as stream:
              resources = [item for item in yaml.safe_load_all(stream) if item]

          deployments = {
              item["metadata"]["labels"].get("app.kubernetes.io/component"): item
              for item in resources
              if item["kind"] == "Deployment"
          }
          for component in ("sandbox-control-plane", "sandbox-runner"):
              deployment = deployments[component]
              pod = deployment["spec"]["template"]["spec"]
              assert pod["runtimeClassName"] == "gvisor"
              assert pod["securityContext"]["runAsNonRoot"] is True
              assert not any("hostPath" in volume for volume in pod.get("volumes", []))
              for container in pod["containers"]:
                  security = container["securityContext"]
                  assert security["readOnlyRootFilesystem"] is True
                  assert security["allowPrivilegeEscalation"] is False
                  assert security["capabilities"]["drop"] == ["ALL"]
                  assert security["seccompProfile"]["type"] == "RuntimeDefault"

          policies = [item for item in resources if item["kind"] == "NetworkPolicy"]
          assert any(
              policy["metadata"]["name"].endswith("default-deny")
              and set(policy["spec"]["policyTypes"]) == {"Ingress", "Egress"}
              for policy in policies
          )
          PY

  images:
    name: Build and scan (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: backend
            dockerfile: backend/Dockerfile
          - name: sandbox-control-plane
            context: backend
            dockerfile: backend/Dockerfile.sandbox
          - name: agent-runtime
            context: .
            dockerfile: agent-runtime/Dockerfile
          - name: rag-runtime
            context: .
            dockerfile: rag-runtime/Dockerfile
          - name: sandbox-runner
            context: sandbox-runner
            dockerfile: sandbox-runner/Dockerfile
          - name: web
            context: .
            dockerfile: infra/Dockerfile.web
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build current commit
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          load: true
          push: false
          tags: allcallall-ci/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: allcallall-ci/${{ matrix.name }}:${{ github.sha }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
