name: secret-scan

# Defense-in-depth: scan every PR for leaked secrets using gitleaks (the same
# engine class as GitGuardian, but free & OSS). Catches anything the local
# pre-commit hook missed. Runs on PRs targeting main and on pushes to main.
#
# IMPORTANT: gitleaks is scoped to ONLY the commits introduced by the PR/push
# (base..head / before..after). A full-history scan would also flag pre-existing
# leaks in old commits the team has not yet cleaned, which would block every PR
# regardless of whether it introduces a new secret. We only want to fail a PR
# when *it* adds a secret.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks detect
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compute scan range
        id: range
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            echo "logopts=${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "logopts=${{ github.event.before }}..${{ github.event.after }}" >> "$GITHUB_OUTPUT"
          fi
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ARGS: --log-opts=${{ steps.range.outputs.logopts }}
