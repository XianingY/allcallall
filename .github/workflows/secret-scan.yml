name: secret-scan

# Defense-in-depth: scan every PR for leaked secrets using gitleaks (the same
# engine class as GitGuardian, but free & OSS). Catches anything the local
# pre-commit hook missed. Runs on PRs targeting main and on pushes to main.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks detect
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
