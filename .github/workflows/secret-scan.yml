name: secret-scan

# Defense-in-depth: scan every PR for leaked secrets using gitleaks (the same
# engine class as GitGuardian, but free & OSS). Catches anything the local
# pre-commit hook missed. Runs on PRs targeting main and on pushes to main.
#
# gitleaks-action needs an explicit GITHUB_TOKEN to scan a *pull request* diff
# via the GitHub API. Without it the action falls back to scanning the ENTIRE
# repo history and would fail on pre-existing leaks in old commits (blocking
# every PR regardless of whether it introduces a new secret). With the token it
# scans only the PR's changed files, so the gate only fails when a PR itself
# adds a leak. `pull-requests: read` is required for the API call; comments are
# disabled so we don't need `pull-requests: write`.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    name: gitleaks detect
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_COMMENTS: "false"
