name: CI

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache-dependency-path: backend/go.sum
      - name: Test
        working-directory: backend
        run: go test ./...
      - name: Vet
        working-directory: backend
        run: go vet ./...

  mobile-web:
    name: Mobile / Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install
        working-directory: mobile
        run: npm ci
      - name: Unit tests
        working-directory: mobile
        run: npm run test:unit
      - name: TypeScript
        working-directory: mobile
        run: npx tsc --noEmit
      - name: Lint
        working-directory: mobile
        run: npm run lint
      - name: Export Web
        working-directory: mobile
        run: npx expo export --platform web --output-dir /tmp/allcallall-web-export
      - name: Install Playwright Chromium
        working-directory: mobile
        run: npx playwright install --with-deps chromium
      - name: Web smoke
        working-directory: mobile
        env:
          WEB_SMOKE_EXPORT_DIR: /tmp/allcallall-web-export
        run: npm run web:smoke

  desktop:
    name: Desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install
        working-directory: desktop
        run: npm ci
      - name: Check
        working-directory: desktop
        run: npm run check
      - name: Build unpacked shell
        working-directory: desktop
        run: npm run build
