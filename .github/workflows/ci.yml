name: CI

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache-dependency-path: backend/go.sum
      - name: Build
        run: go build -v ./...
      - name: Vet
        run: go vet ./...
      - name: Lint
        # Config in backend/.golangci.yml. Starts from the rules the code
        # already satisfies so it blocks from day one; the file lists the
        # linters to enable next.
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          working-directory: backend
      - name: Docs consistency
        # Docs previously pointed at files that do not exist (AGENTS.md named
        # a workflow that was never created), which costs anyone who believes
        # them. Checks that referenced paths resolve; not prose.
        working-directory: .
        run: node scripts/check-docs-consistency.mjs
      - name: Pagination gate (no unbounded list Find)
        # 拦截新增的"面向用户列表端点裸写 .Find(&...) 不加 .Limit"回归。
        # 存量违规在 cmd/check-unbounded-find 的 allowlist 中豁免，治理后移除。
        run: go run ./cmd/check-unbounded-find
      - name: Test with coverage
        # Runtime/integration tests that need MySQL/Redis are skipped automatically
        # when their DSN env vars are unset, so this runs the whole tree safely.
        run: go test -coverprofile=coverage.out -covermode=atomic ./...
      - name: Race detector
        # Was pinned to three packages, so races in the other ~45 went
        # undetected. Now the same scope as the coverage step.
        run: go test -race ./internal/...
      - name: Vulnerability scan (informational, non-blocking)
        # informational, non-blocking: govulncheck may require network access to the
        # vulnerability database and should never fail the CI pipeline.
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
        continue-on-error: true
      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1
      - name: Coverage gate
        # Blocking gate. Measured baseline for `go test ./...` is 47.8% total,
        # so the floor starts at 40%: it fails on a real regression without
        # tripping on ordinary day-to-day movement. Raise it as coverage grows.
        run: |
          set -euo pipefail
          MIN_COVERAGE=40
          line=$(go tool cover -func=coverage.out | tail -n 1)
          echo "$line"
          cov=$(echo "$line" | grep -oE '[0-9]+(\.[0-9]+)?' | head -n 1)
          cov_int=${cov%.*}
          if [ -z "$cov_int" ]; then
            echo "::error::could not parse total coverage from '$line'"
            exit 1
          fi
          if [ "$cov_int" -lt "$MIN_COVERAGE" ]; then
            echo "::error::total coverage ${cov_int}% below ${MIN_COVERAGE}% floor"
            exit 1
          fi
          echo "total coverage ${cov_int}% meets ${MIN_COVERAGE}% floor"
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: backend/coverage.out

  backend-integration:
    name: Backend Dependencies
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: integration-root
          MYSQL_DATABASE: allcallall_test
          MYSQL_USER: allcallall
          MYSQL_PASSWORD: integration-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pintegration-root"
          --health-interval=10s --health-timeout=5s --health-retries=10
      redis:
        image: redis:7.2
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache-dependency-path: backend/go.sum
      - name: Start Elasticsearch with IK analysis
        run: |
          docker build -t allcallall-elasticsearch-ik:test infra/elasticsearch
          docker run -d --name allcallall-elasticsearch -p 9200:9200 \
            -e discovery.type=single-node \
            -e xpack.security.enabled=false \
            -e ES_JAVA_OPTS="-Xms512m -Xmx512m" \
            allcallall-elasticsearch-ik:test
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9200/_cluster/health >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs allcallall-elasticsearch
              exit 1
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:9200/_cat/plugins | grep -F analysis-ik
          curl -fsS -X POST http://127.0.0.1:9200/_analyze \
            -H 'Content-Type: application/json' \
            -d '{"analyzer":"ik_max_word","text":"供应商审批流程"}' \
            | grep -F '供应商'
      - name: Start MinIO
        run: |
          docker run -d --name allcallall-minio --user root -p 9000:9000 \
            -e MINIO_ROOT_USER=integration-access \
            -e MINIO_ROOT_PASSWORD=integration-secret \
            docker.io/alpine/minio:latest-release@sha256:cf23643a6cf9ce159c57643ceb88279e431262282428c9e0bf3a7ef1a97e84b4 server /data
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:9000/minio/health/live && exit 0
            echo "waiting for MinIO ($attempt/30)"
            sleep 2
          done
          docker logs allcallall-minio
          exit 1
      - name: Dependency integration tests
        working-directory: backend
        env:
          INTEGRATION_MYSQL_DSN: allcallall:integration-password@tcp(127.0.0.1:3306)/allcallall_test?parseTime=true
          INTEGRATION_REDIS_ADDR: 127.0.0.1:6379
          INTEGRATION_MINIO_ENDPOINT: http://127.0.0.1:9000
          INTEGRATION_MINIO_ACCESS_KEY: integration-access
          INTEGRATION_MINIO_SECRET_KEY: integration-secret
          INTEGRATION_ELASTICSEARCH_URL: http://127.0.0.1:9200
        run: |
          go test -tags=integration ./internal/integration
          ALLCALLALL_TEST_ELASTICSEARCH_URL=http://127.0.0.1:9200 \
            go test -count=1 -run '^TestElasticsearchIKChineseSearchContract$' ./internal/search

  mobile:
    name: Mobile
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install
        working-directory: .
        run: npm ci
      - name: Unit tests
        working-directory: mobile
        run: npm run test:unit
      - name: Unit tests (React Native / Expo, jest-expo)
        working-directory: mobile
        run: npm run test:jest
      - name: TypeScript
        working-directory: mobile
        run: npx tsc --noEmit
      - name: Lint
        working-directory: mobile
        run: npm run lint
      - name: Dependency audit
        # Runs once, at the root: the lockfile is the workspace root's, so
        # auditing from web/ and mobile/ separately was the same tree twice.
        #
        # History: this was `npm audit --audit-level=high || true` with
        # continue-on-error, so it could never fail. It was tightened to a
        # blocking `high` gate on the assumption that the lockfile had no
        # high/critical findings. That assumption does not hold: there are 46
        # high findings, and every one of them traces back to two advisories
        # that have no fixed release on npm:
        #
        #   braces <=3.0.3  stack exhaustion DoS (GHSA-vfj7-8cjw-p6xm)
        #     web -> tailwindcss@3.4.19 -> chokidar / micromatch -> braces@3.0.3
        #   node-forge <=1.4.0  RSA PKCS#1 v1.5 signature verification
        #     (GHSA-86w9-cpqp-85rv)
        #     mobile -> expo@57 -> @expo/cli -> @expo/code-signing-certificates
        #
        # 3.0.3 is the latest braces release and 1.4.0 is the latest node-forge
        # release, so both advisories cover every published version. There is no
        # override target and no non-breaking fix; `npm audit fix` can only
        # resolve them by downgrading expo to 44, react-native to 0.72 or jest
        # to 30, which is a far worse outcome than the advisories themselves.
        #
        # So the gate blocks at critical, where the tree is clean today, and
        # stays honest about the two highs. Move it back to
        # `--audit-level=high` as soon as braces publishes a fixed version and
        # expo's CLI chain moves off node-forge 1.4.0.
        working-directory: .
        run: npm audit --audit-level=critical

  web:
    name: Web
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install
        working-directory: .
        run: npm ci
      - name: Generate API types
        working-directory: web
        run: npm run generate:api
      - name: Contract check
        working-directory: web
        run: npm run contract:check
      - name: TypeScript
        working-directory: web
        run: npm run typecheck
      - name: Lint
        working-directory: web
        run: npm run lint
      - name: Unit tests with coverage gate
        working-directory: web
        run: npm run test:coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-coverage
          path: web/coverage
      # Dependency auditing happens once in the mobile job, at the workspace
      # root - see the note there. Auditing again here would re-check the same
      # lockfile.
      - name: Build
        working-directory: web
        run: npm run build
      - name: Bundle budget
        working-directory: web
        run: npm run bundle:budget
      - name: Install Playwright Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Browser E2E
        working-directory: web
        run: npx playwright test

  authenticated-web-e2e:
    name: Authenticated Beta Web E2E
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      WEB_SMOKE_BASE_URL: ${{ secrets.BETA_E2E_BASE_URL }}
      WEB_SMOKE_EMAIL: ${{ secrets.BETA_E2E_USER_ONE }}
      WEB_SMOKE_PASSWORD: ${{ secrets.BETA_E2E_PASSWORD_ONE }}
      WEB_SMOKE_SECOND_EMAIL: ${{ secrets.BETA_E2E_USER_TWO }}
      WEB_SMOKE_SECOND_PASSWORD: ${{ secrets.BETA_E2E_PASSWORD_TWO }}
      WEB_SMOKE_ROOM_ID: ${{ secrets.BETA_E2E_ROOM_ID }}
    steps:
      - uses: actions/checkout@v7
        if: ${{ env.WEB_SMOKE_BASE_URL != '' }}
      - uses: actions/setup-node@v5
        if: ${{ env.WEB_SMOKE_BASE_URL != '' }}
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install
        if: ${{ env.WEB_SMOKE_BASE_URL != '' }}
        working-directory: .
        run: npm ci
      - name: Install Playwright Chromium
        if: ${{ env.WEB_SMOKE_BASE_URL != '' }}
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Authenticated Web smoke
        if: ${{ env.WEB_SMOKE_BASE_URL != '' }}
        working-directory: web
        env:
          WEB_E2E_BASE_URL: ${{ env.WEB_SMOKE_BASE_URL }}
        run: npx playwright test --project=desktop

  desktop:
    name: Desktop
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install
        working-directory: desktop
        run: npm ci
      - name: Check
        working-directory: desktop
        run: npm run check
      - name: Build unpacked shell
        working-directory: desktop
        run: npm run build
