name: CI

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.24.x"
          cache-dependency-path: backend/go.sum
      - name: Test
        working-directory: backend
        run: go test ./...
      - name: Vet
        working-directory: backend
        run: go vet ./...
      - name: Race detector
        working-directory: backend
        run: go test -race ./internal/agent ./internal/collaboration ./internal/events

  backend-integration:
    name: Backend Dependencies
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: integration-root
          MYSQL_DATABASE: allcallall_test
          MYSQL_USER: allcallall
          MYSQL_PASSWORD: integration-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pintegration-root"
          --health-interval=10s --health-timeout=5s --health-retries=10
      redis:
        image: redis:7.2
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.24.x"
          cache-dependency-path: backend/go.sum
      - name: Start Elasticsearch with IK analysis
        run: |
          docker build -t allcallall-elasticsearch-ik:test infra/elasticsearch
          docker run -d --name allcallall-elasticsearch -p 9200:9200 \
            -e discovery.type=single-node \
            -e xpack.security.enabled=false \
            -e ES_JAVA_OPTS="-Xms512m -Xmx512m" \
            allcallall-elasticsearch-ik:test
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9200/_cluster/health >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs allcallall-elasticsearch
              exit 1
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:9200/_cat/plugins | grep -F analysis-ik
          curl -fsS -X POST http://127.0.0.1:9200/_analyze \
            -H 'Content-Type: application/json' \
            -d '{"analyzer":"ik_max_word","text":"供应商审批流程"}' \
            | grep -F '供应商'
      - name: Start MinIO
        run: |
          docker run -d --name allcallall-minio -p 9000:9000 \
            -e MINIO_ROOT_USER=integration-access \
            -e MINIO_ROOT_PASSWORD=integration-secret \
            minio/minio:latest server /data
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:9000/minio/health/live && exit 0
            echo "waiting for MinIO ($attempt/30)"
            sleep 2
          done
          docker logs allcallall-minio
          exit 1
      - name: Dependency integration tests
        working-directory: backend
        env:
          INTEGRATION_MYSQL_DSN: allcallall:integration-password@tcp(127.0.0.1:3306)/allcallall_test?parseTime=true
          INTEGRATION_REDIS_ADDR: 127.0.0.1:6379
          INTEGRATION_MINIO_ENDPOINT: http://127.0.0.1:9000
          INTEGRATION_MINIO_ACCESS_KEY: integration-access
          INTEGRATION_MINIO_SECRET_KEY: integration-secret
          INTEGRATION_ELASTICSEARCH_URL: http://127.0.0.1:9200
        run: |
          go test -tags=integration ./internal/integration
          ALLCALLALL_TEST_ELASTICSEARCH_URL=http://127.0.0.1:9200 \
            go test -count=1 -run '^TestElasticsearchIKChineseSearchContract$' ./internal/search

  mobile:
    name: Mobile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install
        working-directory: .
        run: npm ci
      - name: Unit tests
        working-directory: mobile
        run: npm run test:unit
      - name: TypeScript
        working-directory: mobile
        run: npx tsc --noEmit
      - name: Lint
        working-directory: mobile
        run: npm run lint

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install
        working-directory: .
        run: npm ci
      - name: Generate API types
        working-directory: web
        run: npm run generate:api
      - name: Contract check
        working-directory: web
        run: npm run contract:check
      - name: TypeScript
        working-directory: web
        run: npm run typecheck
      - name: Lint
        working-directory: web
        run: npm run lint
      - name: Unit tests
        working-directory: web
        run: npm test
      - name: Build
        working-directory: web
        run: npm run build
      - name: Bundle budget
        working-directory: web
        run: npm run bundle:budget
      - name: Install Playwright Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Browser E2E
        working-directory: web
        run: npx playwright test

  authenticated-web-e2e:
    name: Authenticated Beta Web E2E
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    env:
      WEB_SMOKE_BASE_URL: ${{ secrets.BETA_E2E_BASE_URL }}
      WEB_SMOKE_EMAIL: ${{ secrets.BETA_E2E_USER_ONE }}
      WEB_SMOKE_PASSWORD: ${{ secrets.BETA_E2E_PASSWORD_ONE }}
      WEB_SMOKE_SECOND_EMAIL: ${{ secrets.BETA_E2E_USER_TWO }}
      WEB_SMOKE_SECOND_PASSWORD: ${{ secrets.BETA_E2E_PASSWORD_TWO }}
      WEB_SMOKE_ROOM_ID: ${{ secrets.BETA_E2E_ROOM_ID }}
    steps:
      - uses: actions/checkout@v5
        if: ${{ env.WEB_SMOKE_BASE_URL != '' }}
      - uses: actions/setup-node@v5
        if: ${{ env.WEB_SMOKE_BASE_URL != '' }}
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install
        if: ${{ env.WEB_SMOKE_BASE_URL != '' }}
        working-directory: .
        run: npm ci
      - name: Install Playwright Chromium
        if: ${{ env.WEB_SMOKE_BASE_URL != '' }}
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Authenticated Web smoke
        if: ${{ env.WEB_SMOKE_BASE_URL != '' }}
        working-directory: web
        env:
          WEB_E2E_BASE_URL: ${{ env.WEB_SMOKE_BASE_URL }}
        run: npx playwright test --project=desktop

  desktop:
    name: Desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install
        working-directory: desktop
        run: npm ci
      - name: Check
        working-directory: desktop
        run: npm run check
      - name: Build unpacked shell
        working-directory: desktop
        run: npm run build
