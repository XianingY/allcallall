name: Frontend CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  web-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
    - uses: actions/checkout@v5
    - name: Use Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: package-lock.json
    - name: Install dependencies
      working-directory: .
      run: npm ci
    - name: Type Check
      run: npm run typecheck --if-present || npx tsc --noEmit
    - name: Lint
      run: npm run lint --if-present

  mobile-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
    - uses: actions/checkout@v5
    - name: Use Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: package-lock.json
    - name: Install dependencies
      working-directory: .
      run: npm ci
    - name: Type Check
      run: npm run typecheck --if-present || npx tsc --noEmit
    - name: Lint
      run: npm run lint --if-present
