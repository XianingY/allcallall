name: Frontend CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  web-ci:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: package-lock.json
    - name: Install dependencies
      working-directory: .
      run: npm ci
    - name: Type Check
      run: npm run typecheck --if-present || npx tsc --noEmit
    - name: Lint
      run: npm run lint --if-present
    - name: Unit tests with coverage gate
      # The vite.config thresholds act as a regression floor; this step fails
      # the build if coverage drops below the configured minimums.
      run: npm run test:coverage
    - name: npm audit (informational, non-blocking)
      # informational, non-blocking
      run: npm audit --audit-level=high || true
      continue-on-error: true
    - name: Upload coverage report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: web-coverage
        path: web/coverage

  mobile-ci:
    name: Mobile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: package-lock.json
    - name: Install dependencies
      working-directory: .
      run: npm ci
    - name: Type Check
      run: npm run typecheck --if-present || npx tsc --noEmit
    - name: Lint
      run: npm run lint --if-present
    - name: Unit tests
      run: npm run test:unit
    - name: npm audit (informational, non-blocking)
      # informational, non-blocking
      run: npm audit --audit-level=high || true
      continue-on-error: true
