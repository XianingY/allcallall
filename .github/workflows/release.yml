name: Release Images

# CD closure for the main repo. Triggered only on semantic version tags
# (v*.*.*), it builds the main-repo images with buildx, scans them with Trivy
# (HIGH,CRITICAL -> fail the job), then pushes the versioned tag to ghcr.io.
# Images that live in the sibling allcallall-agent-runtime repo are published
# by that repo's own publish.yml workflow.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write
  # Required for keyless image signing: cosign exchanges the workflow's OIDC
  # token for a short-lived certificate, so no signing key has to be stored
  # or rotated. Without this the sign step fails.
  id-token: write

jobs:
  images:
    name: Build, scan and push (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: backend
            dockerfile: backend/Dockerfile
          - name: sandbox-control-plane
            context: backend
            dockerfile: backend/Dockerfile.sandbox
          - name: sandbox-supervisor
            context: backend
            dockerfile: backend/Dockerfile.supervisor
          - name: elasticsearch-ik
            context: infra/elasticsearch
            dockerfile: infra/elasticsearch/Dockerfile
          - name: web
            context: .
            dockerfile: infra/Dockerfile.web
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - name: Build and load ${{ matrix.name }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          load: true
          push: false
          tags: ghcr.io/xianingy/allcallall/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Scan ${{ matrix.name }} with Trivy
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: ghcr.io/xianingy/allcallall/${{ matrix.name }}:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      # Produce an SBOM before the image is published, so a consumer can answer
      # "what is in this image" without pulling it apart. Without this, the
      # only record of dependencies is the source tree at build time.
      - name: SBOM for ${{ matrix.name }}
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/xianingy/allcallall/${{ matrix.name }}:${{ github.sha }}
          format: spdx-json
          artifact-name: sbom-${{ matrix.name }}.spdx.json
          upload-artifact: true
      - name: Tag and push ${{ matrix.name }}
        run: |
          docker tag \
            ghcr.io/xianingy/allcallall/${{ matrix.name }}:${{ github.sha }} \
            ghcr.io/xianingy/allcallall/${{ matrix.name }}:${GITHUB_REF_NAME}
          docker push ghcr.io/xianingy/allcallall/${{ matrix.name }}:${GITHUB_REF_NAME}
      # Sign after pushing. Keyless: cosign exchanges this workflow's OIDC
      # token for a short-lived certificate, so there is no key to store or
      # rotate, and the signature is recorded in the public Rekor log.
      #
      # Signed by digest, never by tag - a tag can be repointed between the
      # scan and the push, so signing the tag would attest to whatever the
      # registry happens to serve at that moment.
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
      - name: Sign ${{ matrix.name }}
        env:
          IMAGE: ghcr.io/xianingy/allcallall/${{ matrix.name }}:${GITHUB_REF_NAME}
        run: |
          set -euo pipefail
          digest=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE")
          if [ -z "$digest" ]; then
            echo "::error::could not resolve a digest for $IMAGE"
            exit 1
          fi
          echo "signing $digest"
          cosign sign --yes "$digest"
      - name: Verify ${{ matrix.name }}
        env:
          IMAGE: ghcr.io/xianingy/allcallall/${{ matrix.name }}:${GITHUB_REF_NAME}
        run: |
          set -euo pipefail
          digest=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE")
          # Verify through the same identity the signing step used, so a broken
          # signature fails the release instead of shipping unattested images.
          cosign verify "$digest" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp "^https://github\.com/${GITHUB_REPOSITORY}/.*$" | tail -n 1
