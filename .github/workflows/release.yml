name: Release Images

# CD closure for the main repo. Triggered only on semantic version tags
# (v*.*.*), it builds the main-repo images with buildx, scans them with Trivy
# (HIGH,CRITICAL -> fail the job), then pushes the versioned tag to ghcr.io.
# Images that live in the sibling allcallall-agent-runtime repo are published
# by that repo's own publish.yml workflow.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

jobs:
  images:
    name: Build, scan and push (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: backend
            dockerfile: backend/Dockerfile
          - name: sandbox-control-plane
            context: backend
            dockerfile: backend/Dockerfile.sandbox
          - name: sandbox-supervisor
            context: backend
            dockerfile: backend/Dockerfile.supervisor
          - name: elasticsearch-ik
            context: infra/elasticsearch
            dockerfile: infra/elasticsearch/Dockerfile
          - name: web
            context: .
            dockerfile: infra/Dockerfile.web
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - name: Build and load ${{ matrix.name }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          load: true
          push: false
          tags: ghcr.io/xianingy/allcallall/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Scan ${{ matrix.name }} with Trivy
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: ghcr.io/xianingy/allcallall/${{ matrix.name }}:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Tag and push ${{ matrix.name }}
        run: |
          docker tag \
            ghcr.io/xianingy/allcallall/${{ matrix.name }}:${{ github.sha }} \
            ghcr.io/xianingy/allcallall/${{ matrix.name }}:${GITHUB_REF_NAME}
          docker push ghcr.io/xianingy/allcallall/${{ matrix.name }}:${GITHUB_REF_NAME}
