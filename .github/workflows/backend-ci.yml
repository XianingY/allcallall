name: Backend CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.24.x'
        cache-dependency-path: backend/go.sum

    - name: Build
      run: go build -v ./...

    - name: Vet
      run: go vet ./...

    - name: Pagination gate (no unbounded list Find)
      # 拦截新增的"面向用户列表端点裸写 .Find(&...) 不加 .Limit"回归。
      # 存量违规在 cmd/check-unbounded-find 的 allowlist 中豁免，治理后移除。
      run: go run ./cmd/check-unbounded-find

    - name: Test with coverage
      # Runtime/integration tests that need MySQL/Redis are skipped automatically
      # when their DSN env vars are unset, so this runs the whole tree safely.
      run: go test -coverprofile=coverage.out -covermode=atomic ./...

    - name: Vulnerability scan (informational, non-blocking)
      # informational, non-blocking: govulncheck may require network access to the
      # vulnerability database and should never fail the CI pipeline.
      run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      continue-on-error: true

    - name: Coverage summary
      run: go tool cover -func=coverage.out | tail -1

    - name: Coverage gate
      # Non-blocking gate (visibility + skeleton only). The baseline is not yet
      # established, so a low total coverage only warns and never fails the run.
      # ----------------------------------------------------------------------
      # To flip this into a BLOCKING gate once a baseline is agreed, replace the
      # `echo "::warning::..."` branch with a hard failure, e.g.:
      #
      #   if [ "$cov" -lt 30 ]; then
      #     echo "::error::total coverage ${cov}% below 30% floor"
      #     exit 1
      #   fi
      #
      # (Remove the `exit 0` fallback below and keep `set -euo pipefail`.)
      # ----------------------------------------------------------------------
      run: |
        set -euo pipefail
        MIN_COVERAGE=30
        line=$(go tool cover -func=coverage.out | tail -n 1)
        echo "$line"
        cov=$(echo "$line" | grep -oE '[0-9]+(\.[0-9]+)?' | head -n 1)
        cov_int=${cov%.*}
        if [ -z "$cov_int" ]; then
          echo "::warning::could not parse total coverage from '$line'"
          exit 0
        fi
        if [ "$cov_int" -lt "$MIN_COVERAGE" ]; then
          echo "::warning::total coverage ${cov_int}% below ${MIN_COVERAGE}% floor"
          exit 0
        fi
        echo "total coverage ${cov_int}% meets ${MIN_COVERAGE}% floor"

    - name: Upload coverage report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: backend-coverage
        path: backend/coverage.out
